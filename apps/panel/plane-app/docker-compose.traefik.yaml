services:
  proxy:
    ports: !reset []
    networks:
      - default
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network
      - traefik.http.routers.plane-mentor.rule=Host(`mentor.fesmu.ru`)
      - traefik.http.routers.plane-mentor.entrypoints=websecure
      - traefik.http.routers.plane-mentor.tls=true
      - traefik.http.routers.plane-mentor.tls.certresolver=letsencrypt
      - traefik.http.routers.plane-mentor.service=plane-mentor
      - traefik.http.services.plane-mentor.loadbalancer.server.port=80

networks:
  traefik-network:
    external: true
