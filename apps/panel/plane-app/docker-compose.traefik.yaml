services:
  proxy:
    ports: !reset []
    networks:
      - default
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network
      - traefik.http.routers.plane-test.rule=Host(`test.fesmu.ru`)
      - traefik.http.routers.plane-test.entrypoints=websecure
      - traefik.http.routers.plane-test.tls=true
      - traefik.http.routers.plane-test.tls.certresolver=letsencrypt
      - traefik.http.routers.plane-test.service=plane-test
      - traefik.http.services.plane-test.loadbalancer.server.port=80

networks:
  traefik-network:
    external: true
