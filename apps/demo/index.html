    function periodRange(periodId){if(periodId==='custom'){const format=date=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(new Date(`${date}T12:00:00`));return analyticsCustomFrom===analyticsCustomTo?format(analyticsCustomFrom):`${format(analyticsCustomFrom)} — ${format(analyticsCustomTo)}`;}const p=analyticsPeriods[periodId];if(periodId==='day')return '25 ноября 2026';return `${p.from.slice(8,10)}–${p.to.slice(8,10)} ноября 2026`;}
    function isInAnalyticsPeriod(date,periodId){if(periodId==='custom')return date>=analyticsCustomFrom&&date<=analyticsCustomTo;const p=analyticsPeriods[periodId];return date>=p.from&&date<=p.to;}
    function percent(value,total){return total?Math.round(value/total*100):0;}
    function restroomPeriodData(room,periodId){const surveys=room.surveys.filter(s=>isInAnalyticsPeriod(s.date,periodId));const reports=room.reports.filter(r=>isInAnalyticsPeriod(r.date,periodId));const avg=(key)=>surveys.length?(surveys.reduce((sum,s)=>sum+s[key],0)/surveys.length).toFixed(1).replace('.',','):'—';return {surveys,reports,cleanliness:avg('cleanliness'),odor:avg('odor'),paper:reports.filter(r=>r.item==='paper'),soap:reports.filter(r=>r.item==='soap')};}
    function restroomSummary(periodId){const byRoom=restroomData.map(room=>({room,...restroomPeriodData(room,periodId)}));const flagged=byRoom.filter(r=>r.paper.length||r.soap.length||r.surveys.some(s=>s.cleanliness<=2||s.odor<=2));const uniqueWith=(key)=>byRoom.filter(r=>r[key].length).map(r=>({room:r,count:r[key].length,last:r[key].map(item=>item.date).sort().at(-1)}));const allSurveys=byRoom.flatMap(r=>r.surveys);const avg=(key)=>allSurveys.length?(allSurveys.reduce((sum,s)=>sum+s[key],0)/allSurveys.length).toFixed(1).replace('.',','):'—';return {byRoom,flagged,paper:uniqueWith('paper'),soap:uniqueWith('soap'),avgCleanliness:avg('cleanliness'),avgOdor:avg('odor')};}
    function setAnalyticsPeriod(periodId){analyticsPeriod=periodId;if(currentPage==='analytics')analyticsPage();else if(currentPage==='analytics-restrooms')refreshRestroomsAnalytics();}
    function setAnalyticsRange(edge,date){if(!date)return;if(edge==='from'){analyticsCustomFrom=date;if(analyticsCustomTo<date)analyticsCustomTo=date;}else{analyticsCustomTo=date;if(analyticsCustomFrom>date)analyticsCustomFrom=date;}analyticsPeriod='custom';if(currentPage==='analytics')analyticsPage();else if(currentPage==='analytics-restrooms')refreshRestroomsAnalytics();}

    function mountAnalyticsDatePicker(){const period=document.querySelector('.analytics-period');if(!period||period.nextElementSibling?.classList.contains('analytics-date-picker'))return;period.insertAdjacentHTML('afterend',`<div class="analytics-date-picker"><strong>Своя дата</strong><label for="analytics-date-from">с</label><input id="analytics-date-from" aria-label="Начало периода" type="date" value="${analyticsCustomFrom}" onchange="setAnalyticsRange('from',this.value)"><label for="analytics-date-to">по</label><input id="analytics-date-to" aria-label="Конец периода" type="date" value="${analyticsCustomTo}" onchange="setAnalyticsRange('to',this.value)"></div>`);}
    function addCriticalAlerts(summary){const note=document.querySelector('.analytics-note');if(!note)return;const alerts=summary.byRoom.map(item=>{const reasons=[],dates=[],reviews=[];for(const [key,label] of [['paper','Нет туалетной бумаги'],['soap','Нет мыла']])if(item[key].length){reasons.push(label);dates.push(...item[key].map(report=>report.date));}for(const key of ['cleanliness','odor']){const poor=item.surveys.filter(s=>s[key]<=2).sort((a,b)=>a.date.localeCompare(b.date));if(poor.length){const latest=poor[poor.length-1];reasons.push(`Низкая ${key==='cleanliness'?'чистота':'оценка запаха'}: ${latest[key]} из 5`);dates.push(latest.date);reviews.push(latest.review||'Низкая оценка по отзыву');}}return reasons.length?{item,reasons,date:dates.sort().at(-1),review:reviews.at(-1)||`${item.reports.length} ${plural(item.reports.length,'сообщение','сообщения','сообщений')}`} :null;}).filter(Boolean).sort((a,b)=>b.date.localeCompare(a.date));const markup=alerts.length?`<section class="critical-alerts"><header><strong>Требуют внимания</strong><span>${alerts.length} ${plural(alerts.length,'санузел','санузла','санузлов')} за период</span></header><div class="critical-list">${alerts.map(alert=>`<button type="button" class="critical-row" onclick="openRestroom('${alert.item.room.code}')"><span class="critical-room"><b>ID ${alert.item.room.code}</b><small>${alert.item.room.building} · ${alert.item.room.floor} · ${alert.item.room.type.toLowerCase()}, ${alert.item.room.wing}</small></span><span class="critical-copy"><strong>${alert.reasons.join(' · ')}</strong><small>${formatReportDate(alert.date)} · ${alert.review}</small></span><span class="critical-chevron">›</span></button>`).join('')}</div></section>`:`<section class="critical-alerts all-clear"><strong>Критичных замечаний за период нет</strong><span>Низких оценок и сообщений об отсутствии расходных материалов не найдено.</span></section>`;note.insertAdjacentHTML('afterend',markup);}
    function attachRestroomDetails(summary){document.querySelectorAll('.restroom-card').forEach((card,index)=>{const item=summary.byRoom[index];if(!item)return;card.dataset.restroomCode=item.room.code;card.querySelector('.restroom-number').textContent=`ID ${item.room.code} · ${item.room.building} · ${item.room.floor}`;const reviews=item.surveys.length?item.surveys.map(s=>`<div class="review-entry ${s.cleanliness<=2||s.odor<=2?'review-critical':''}"><div><b>${formatReportDate(s.date)}</b><span>Чистота ${s.cleanliness}/5 · Запах ${s.odor}/5</span></div><p>${s.review||'Отзыв без комментария'}</p></div>`).join(''):'<p class="details-empty">За выбранный период оценок нет.</p>';const reports=item.reports.length?item.reports.map(r=>`<div class="report-entry ${r.item==='paper'?'report-critical':''}"><b>${r.item==='paper'?'Нет туалетной бумаги':'Нет мыла'}</b><span>${formatReportDate(r.date)}</span></div>`).join(''):'<p class="details-empty">Сообщений об отсутствии бумаги или мыла нет.</p>';card.insertAdjacentHTML('beforeend',`<div class="restroom-extra" hidden><h4>Отзывы и оценки</h4>${reviews}<h4>Сообщения</h4>${reports}</div>`);card.setAttribute('role','button');card.setAttribute('tabindex','0');card.setAttribute('aria-expanded','false');const toggle=()=>{const extra=card.querySelector('.restroom-extra'),open=extra.hidden;extra.hidden=!open;card.setAttribute('aria-expanded',String(open));card.classList.toggle('expanded',open);};card.addEventListener('click',event=>{if(event.target.closest('.restroom-extra'))return;toggle();});card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle();}});});}

    function restroomsAnalytics(){const summary=restroomSummary(analyticsPeriod);content.innerHTML=`<button class="secondary analytics-back" onclick="showPage('analytics')">←　Вся аналитика</button><header class="analytics-heading"><span class="module-icon blue"><span class="icon">${icon('clipboard')}</span></span><div><h1 class="page-title">Санузлы</h1><p>Оценки состояния и сообщения об отсутствии расходных материалов</p></div></header><div class="analytics-period" role="group" aria-label="Период аналитики">${Object.entries(analyticsPeriods).map(([id,period])=>`<button class="period-button ${analyticsPeriod===id?'active':''}" onclick="setAnalyticsPeriod('${id}')">${period.label}</button>`).join('')}</div><p class="analytics-note">${periodRange(analyticsPeriod)} · демонстрационные данные · режим просмотра; опросы создаёт и редактирует администратор</p><section class="analytics-summary restroom-summary"><div><span>Санузлы с замечаниями</span><strong>${summary.flagged.length} из ${restroomData.length}</strong><small>${percent(summary.flagged.length,restroomData.length)}% санузлов · каждый санузел учитывается один раз</small></div><div><span>Нет туалетной бумаги</span><strong>${summary.paper.length} ${plural(summary.paper.length,'санузел','санузла','санузлов')}</strong><small>${percent(summary.paper.length,restroomData.length)}% · ${summary.paper.reduce((n,r)=>n+r.count,0)} сообщений</small></div><div><span>Нет мыла</span><strong>${summary.soap.length} ${plural(summary.soap.length,'санузел','санузла','санузлов')}</strong><small>${percent(summary.soap.length,restroomData.length)}% · ${summary.soap.reduce((n,r)=>n+r.count,0)} сообщений</small></div></section><div class="restroom-list-heading"><h2>Показатели по санузлам</h2><span>Чистота и запах — средняя оценка за выбранный период</span></div><div class="restroom-cards">${summary.byRoom.map(item=>`<article class="restroom-card"><div class="restroom-card-top"><div><span class="restroom-number">${item.room.building} · ${item.room.floor}</span><h3>${item.room.type} санузел</h3><p>${item.room.wing}</p></div><span class="restroom-surveys">${item.surveys.length?`${item.surveys.length} ${plural(item.surveys.length,'оценка','оценки','оценок')}`:'Нет оценок'}</span></div><div class="restroom-ratings"><span><small>Чистота</small><strong>${item.cleanliness}<em> из 5</em></strong></span><span><small>Запах</small><strong>${item.odor}<em> из 5</em></strong></span></div><div class="restroom-issues">${issueIndicator(item,'paper','Бумага')}${issueIndicator(item,'soap','Мыло')}</div></article>`).join('')}</div><p class="analytics-footnote">Показатели собраны из демонстрационных оценок и сообщений. Сводка замечаний считает каждый санузел один раз за период, даже если по нему поступило несколько сообщений.</p>`;}
    function plural(n,one,few,many){const mod10=n%10,mod100=n%100;return mod10===1&&mod100!==11?one:mod10>=2&&mod10<=4&&(mod100<12||mod100>14)?few:many;}
    function tasksPage(){content.innerHTML=`<section class="task-card"><header class="task-header"><div class="task-mark">Д</div><div><p class="eyebrow">ДВГМУ · Личный кабинет</p><h1>Мои задачи</h1></div></header><form id="task-form"><label class="form-label" for="task-title">Новая задача</label><div class="task-form"><input id="task-title" maxlength="200" placeholder="Например, подготовить документы" required><button class="primary" type="submit">Создать</button></div></form><div class="list-head"><h2>Список</h2><span class="count" id="count">${mockTasks.length}</span></div><ul class="tasks" id="tasks-list">${mockTasks.map(taskRow).join('')}</ul></section>`;document.getElementById('task-form').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('task-title'),title=input.value.trim();if(!title)return;mockTasks.unshift({title,date:new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date()).replace(' г.','')});tasksPage();toast('Задача добавлена');});}
    function learningPage(){content.innerHTML=`<h1 class="page-title">Обучение</h1><p class="preview-note" style="margin:0 0 18px">Учебная информация и тестирование</p><div class="learning-grid"><div class="learning-link"><span class="module-icon violet"><span class="icon">${icon('book')}</span></span><div><h2>Учебная информация</h2><p>Расписание и сведения об учебном процессе будут доступны в этом разделе.</p></div></div><div class="learning-link" onclick="showPage('exam')"><span class="module-icon blue"><span class="icon">${icon('graduation')}</span></span><div><h2>Экзаменационное тестирование</h2><p>Выдача теста группе, прохождение сессии и просмотр результатов.</p></div></div><div class="learning-link" onclick="showPage('current-test')"><span class="module-icon blue"><span class="icon">${icon('clipboard')}</span></span><div><h2>Текущее тестирование</h2><p>Тестирование под контролем преподавателя или самостоятельно.</p></div></div></div>`;}
    function taskRow(task){return `<li><span class="dot"></span><span class="task-name">${escapeHtml(task.title)}</span><time>${task.date}</time></li>`;}
    function profile(){content.innerHTML=`<section class="profile-card"><h1>Профиль</h1><p class="subtitle">${activeProfile.name}</p><div class="profile-grid"><div class="field"><small>Имя</small><strong>${activeProfile.name.split(' ')[0]}</strong></div><div class="field"><small>Роль</small><strong>${activeProfile.role}</strong></div><div class="field"><small>Электронная почта</small><strong>${activeProfile.email}</strong></div><div class="field"><small>Телефон</small><strong>${activeProfile.phone}</strong></div><div class="field"><small>ID профиля</small><strong>${activeProfile.userId}</strong></div><div class="field"><small>Доступы в демо</small><strong>${activeProfile.access}</strong></div></div><button class="secondary profile-change" onclick="toggleProfileSwitcher(event)">Переключить профиль</button></section>`;}
    const examData={faculties:[{name:'Лечебный факультет',specialties:[{name:'Лечебное дело',disciplines:[{name:'Анатомия человека',semesters:[1,2,3]},{name:'Биохимия',semesters:[2,3]},{name:'Физиология',semesters:[2,3,4]}]},{name:'Педиатрия',disciplines:[{name:'Анатомия человека',semesters:[1,2]},{name:'Общая химия',semesters:[1,2]}]}]},{name:'Стоматологический факультет',specialties:[{name:'Стоматология',disciplines:[{name:'Анатомия человека',semesters:[1,2]},{name:'Гистология',semesters:[1,2,3]}]}]},{name:'Фармацевтический факультет',specialties:[{name:'Фармация',disciplines:[{name:'Общая химия',semesters:[1,2]},{name:'Ботаника',semesters:[2,3]}]}]}]};
    const mockTests=[
      {id:'exam-anatomy',type:'exam',title:'Итоговый тест по анатомии',subject:'Анатомия человека',questions:25,duration:30,updated:'20 нояб. 2026'},
      {id:'exam-biochemistry',type:'exam',title:'Экзаменационный тест по биохимии',subject:'Биохимия',questions:40,duration:45,updated:'18 нояб. 2026'},
      {id:'exam-physiology',type:'exam',title:'Контроль знаний по физиологии',subject:'Физиология',questions:30,duration:35,updated:'12 нояб. 2026'},
      {id:'current-anatomy',type:'current',title:'Текущий контроль: опорно-двигательная система',subject:'Анатомия человека',questions:15,duration:20,updated:'22 нояб. 2026'},
      {id:'current-histology',type:'current',title:'Практическая работа по тканям',subject:'Гистология',questions:12,duration:15,updated:'21 нояб. 2026'},
      {id:'current-chemistry',type:'current',title:'Проверка по общей химии',subject:'Общая химия',questions:20,duration:25,updated:'19 нояб. 2026'}
    ];
    let chosenTest=null;
    function examPage(screen='list',testType=null){if(testType){currentTestType=testType;chosenTest=null;}if(!activeProfile.canManageTests&&(screen==='issue'||screen==='results'))screen='list';const typeLabel=currentTestType==='current'?'Текущее тестирование':'Экзаменационное тестирование',managementTabs=activeProfile.canManageTests?`<button class="mode-tab ${screen==='issue'?'active':''}" onclick="examPage('issue')">Выдать сессию</button><button class="mode-tab ${screen==='results'?'active':''}" onclick="examPage('results')">Статистика</button>`:'';content.innerHTML=`<nav class="exam-modes"><button class="mode-tab ${screen==='list'?'active':''}" onclick="examPage('list')">${activeProfile.canManageTests?'Список тестов':'Мои тесты'}</button>${managementTabs}<button class="mode-tab ${screen==='session'?'active':''}" onclick="examPage('session')">Сессия студента</button></nav><p class="preview-note">${typeLabel} · профиль: ${activeProfile.role}</p><div id="exam-view"></div>`;if(screen==='list')testList();if(screen==='issue')examIssue();if(screen==='session')examSession();if(screen==='results')examResults();}
    function testList(){const tests=mockTests.filter(test=>test.type===currentTestType);if(activeProfile.canManageTests){document.getElementById('exam-view').innerHTML=`<section class="exam-card"><header class="exam-head"><div><h1>Список тестов</h1><p>Выберите тест, чтобы создать и выдать сессию группе.</p></div><button class="primary" onclick="startSession('')">Создать сессию</button></header><div class="test-list">${tests.map(test=>`<article class="test-row"><div class="test-info"><h2>${test.title}</h2><p>${test.subject} · ${test.questions} вопросов · ${test.duration} минут</p><small>Обновлён ${test.updated}</small></div><button class="secondary" onclick="startSession('${test.id}')">Выдать группе</button></article>`).join('')}</div></section>`;return;}const assigned=tests.slice(0,2);document.getElementById('exam-view').innerHTML=`<section class="exam-card"><header class="exam-head"><div><h1>Назначенные тесты</h1><p>Откройте назначенную преподавателем сессию. В демо показаны разные состояния прохождения.</p></div></header><div class="test-list">${assigned.map((test,index)=>`<article class="test-row"><div class="test-info"><h2>${test.title}</h2><p>${test.subject} · ${test.questions} вопросов · ${test.duration} минут</p><small>${index===0?'Открыто для прохождения · до 30 ноября':'Ожидает начала'}</small></div><button class="primary" onclick="startStudentTest('${test.id}')">${index===0?'Начать тест':'Открыть'}</button></article>`).join('')}</div></section>`;}
    function startStudentTest(testId){const test=mockTests.find(item=>item.id===testId);if(!test)return;currentTestType=test.type;activeExam={...activeExam,type:test.type,typeLabel:test.type==='current'?'Текущее тестирование':'Экзаменационное тестирование',mode:'self',modeLabel:'Самостоятельно студентами',testId:test.id,testTitle:test.title,specialty:'Лечебное дело',discipline:test.subject,semester:'2 семестр',group:'ЛД-201'};examPage('session');}
    function startSession(testId){if(!activeProfile.canManageTests){toast('У студента нет доступа к выдаче сессий');return;}chosenTest=mockTests.find(test=>test.id===testId)||mockTests.find(test=>test.type===currentTestType);if(!chosenTest){toast('В списке нет тестов этого типа');return;}examPage('issue');}
    function examIssue(){
      if(!activeProfile.canManageTests){examPage('list');return;}
      if(!chosenTest)chosenTest=mockTests.find(test=>test.type===currentTestType);
      const typeLabel=currentTestType==='current'?'Текущее тестирование':'Экзаменационное тестирование';
      content.innerHTML='<section class="exam-card"><header class="exam-head"><h1>Выдать сессию тестирования</h1><p>Выберите одну или несколько групп. Для группы с другого факультета добавьте ещё одну строку.</p></header><div class="session-test-summary"><span class="summary-label">Выбранный тест</span><strong>'+chosenTest.title+'</strong><span>'+typeLabel+' · '+chosenTest.subject+' · '+chosenTest.questions+' вопросов · '+chosenTest.duration+' минут</span></div><form id="exam-form"><div class="exam-target-heading"><div><h2>Кому выдать</h2><p>Каждая строка — отдельная учебная группа.</p></div><button class="secondary add-target-button" type="button" onclick="addExamTarget()">+ Добавить группу</button></div><div id="exam-targets"></div><div class="exam-grid"><div class="exam-field"><label for="test-mode">Режим прохождения</label><select id="test-mode" required><option value="">Выберите режим</option><option value="supervised">Под контролем преподавателя</option><option value="self">Самостоятельно студентами</option></select></div></div><div class="exam-actions"><span class="hint">Одна сессия будет выдана всем выбранным группам.</span><button class="primary" id="issue-exam" type="submit" disabled>Выдать тестирование</button></div><div id="exam-result"></div></form></section>';
      const form=document.getElementById('exam-form'),container=document.getElementById('exam-targets'),mode=document.getElementById('test-mode'),issue=document.getElementById('issue-exam');
      window.addExamTarget=function(){
        const row=document.createElement('section');
        row.className='exam-target';
        row.innerHTML='<div class="exam-target-top"><span class="exam-target-title">Группа</span><button class="remove-target" type="button" aria-label="Удалить группу">Удалить</button></div><div class="exam-target-fields"><div class="exam-field"><label>Факультет</label><select class="target-faculty" required><option value="">Выберите факультет</option></select></div><div class="exam-field"><label>Специальность</label><select class="target-specialty" required disabled><option value="">Сначала выберите факультет</option></select></div><div class="exam-field"><label>Дисциплина</label><select class="target-discipline" required disabled><option value="">Сначала выберите специальность</option></select></div><div class="exam-field"><label>Семестр</label><select class="target-semester" required disabled><option value="">Сначала выберите дисциплину</option></select></div><div class="exam-field"><label>Группа</label><select class="target-group" required disabled><option value="">Сначала выберите семестр</option></select></div></div>';
        container.appendChild(row);
        const faculty=row.querySelector('.target-faculty'),specialty=row.querySelector('.target-specialty'),discipline=row.querySelector('.target-discipline'),semester=row.querySelector('.target-semester'),group=row.querySelector('.target-group');
        const fill=(el,items,label)=>{el.innerHTML='<option value="">'+label+'</option>'+items.map((v,i)=>'<option value="'+i+'">'+(typeof v==='string'?v:v.name)+'</option>').join('');el.disabled=!items.length;};
        fill(faculty,examData.faculties,'Выберите факультет');
        const update=()=>{issue.disabled=!mode.value||[...container.querySelectorAll('.exam-target')].some(target=>!target.querySelector('.target-group').value);};
        faculty.onchange=()=>{const f=examData.faculties[faculty.value];fill(specialty,f?f.specialties:[],'Выберите специальность');fill(discipline,[],'Сначала выберите специальность');fill(semester,[],'Сначала выберите дисциплину');fill(group,[],'Сначала выберите семестр');update();};
        specialty.onchange=()=>{const sp=examData.faculties[faculty.value]?.specialties[specialty.value];fill(discipline,sp?sp.disciplines:[],'Выберите дисциплину');fill(semester,[],'Сначала выберите дисциплину');fill(group,[],'Сначала выберите семестр');update();};
        discipline.onchange=()=>{const d=examData.faculties[faculty.value]?.specialties[specialty.value]?.disciplines[discipline.value];fill(semester,d?d.semesters.map(n=>n+' семестр'):[],'Выберите семестр');fill(group,[],'Сначала выберите семестр');update();};
        semester.onchange=()=>{const sp=examData.faculties[faculty.value].specialties[specialty.value],sem=sp.disciplines[discipline.value].semesters[semester.value],prefix={'Лечебное дело':'ЛД','Педиатрия':'ПЕ','Стоматология':'СТ','Фармация':'ФА'}[sp.name]||'УЧ';fill(group,[prefix+'-'+sem+'01',prefix+'-'+sem+'02'],'Выберите группу');update();};
        group.onchange=update;
        row.querySelector('.remove-target').onclick=()=>{if(container.querySelectorAll('.exam-target').length>1){row.remove();[...container.querySelectorAll('.exam-target-title')].forEach((title,i)=>title.textContent='Группа '+(i+1));update();}};
        [...container.querySelectorAll('.exam-target')].forEach((target,i)=>{target.querySelector('.exam-target-title').textContent='Группа '+(i+1);target.querySelector('.remove-target').hidden=container.querySelectorAll('.exam-target').length===1;});
        update();
      };
      addExamTarget();
      mode.onchange=()=>{issue.disabled=!mode.value||[...container.querySelectorAll('.exam-target')].some(row=>!row.querySelector('.target-group').value);};
      form.onsubmit=e=>{
        e.preventDefault();
        if(issue.disabled)return;
        const targets=[...container.querySelectorAll('.exam-target')].map(row=>{
          const faculty=row.querySelector('.target-faculty'),specialty=row.querySelector('.target-specialty'),discipline=row.querySelector('.target-discipline'),semester=row.querySelector('.target-semester'),group=row.querySelector('.target-group');
          const f=examData.faculties[faculty.value],sp=f.specialties[specialty.value],d=sp.disciplines[discipline.value];
          return {faculty:f.name,specialty:sp.name,discipline:d.name,semester:semester.options[semester.selectedIndex].text,group:group.options[group.selectedIndex].text};
        });
        const modeLabel=mode.value==='supervised'?'Под контролем преподавателя':'Самостоятельно студентами';
        activeExam={...activeExam,type:currentTestType,typeLabel,mode:mode.value,modeLabel,testId:chosenTest.id,testTitle:chosenTest.title,targets,faculty:[...new Set(targets.map(t=>t.faculty))].join(', '),specialty:[...new Set(targets.map(t=>t.specialty))].join(', '),discipline:[...new Set(targets.map(t=>t.discipline))].join(', '),semester:[...new Set(targets.map(t=>t.semester))].join(', '),group:targets.map(t=>t.group).join(', ')};
        document.getElementById('exam-result').innerHTML='<div class="exam-result"><strong>Сессия создана и выдана '+targets.length+' '+plural(targets.length,'группе','группам','группам')+'</strong>'+activeExam.testTitle+'<br>'+targets.map(t=>t.group+' — '+t.faculty+' · '+t.specialty+' · '+t.discipline+' · '+t.semester).join('<br>')+'<br>Режим: '+activeExam.modeLabel+'<br>Статус: ожидает прохождения</div><button class="primary result-action" type="button" onclick="examPage(\'session\')">Открыть пример сессии</button>';
        toast('Сессия тестирования создана');
      };
    }
    function examSession(){document.getElementById('exam-view').innerHTML=`<section class="exam-card"><div class="session-top"><div><h2>${activeExam.testTitle||activeExam.discipline}</h2><p>${activeExam.specialty} · ${activeExam.semester} · группа ${activeExam.group}</p><p class="session-mode">${activeExam.typeLabel} · ${activeExam.modeLabel}. ${activeExam.mode==='supervised'?'Преподаватель контролирует прохождение.':'Студент проходит тест самостоятельно.'}</p></div><span class="timer">◷ 24:38</span></div><div class="question-label">Вопрос 2 из 5</div><div class="progress-line"><span></span></div><p class="question-title">Какая кость образует основную часть плечевого пояса?</p><div class="answer-option"><span class="radio"></span>Лопатка</div><div class="answer-option selected"><span class="radio"></span>Ключица</div><div class="answer-option"><span class="radio"></span>Плечевая кость</div><div class="answer-option"><span class="radio"></span>Грудина</div><div class="session-footer"><button class="secondary" onclick="toast('Это первый демонстрационный вопрос')">← Назад</button><button class="primary" onclick="examResults()">Завершить тест</button></div></section>`;document.querySelectorAll('.answer-option').forEach(option=>option.onclick=()=>{document.querySelectorAll('.answer-option').forEach(item=>item.classList.remove('selected'));option.classList.add('selected');});}
    function examResults(){if(!activeProfile.canManageTests){examPage('list');return;}document.getElementById('exam-view').innerHTML=`<section class="exam-card"><header class="exam-head"><h1>Статистика сессии</h1><p>${activeExam.testTitle||activeExam.discipline} · ${activeExam.discipline} · ${activeExam.specialty} · группа ${activeExam.group} · ${activeExam.modeLabel}</p></header><div class="result-score"><div class="score-ring">4,6</div><div class="score-meta"><strong>Тестирование завершено</strong><span>Оценка: отлично · правильных ответов 23 из 25 (92%)</span><span>Время прохождения: 18 минут 42 секунды</span></div></div><div class="stats-kpis"><div class="stats-kpi"><span>Участники завершили</span><strong>4 из 8</strong></div><div class="stats-kpi"><span>Средний результат</span><strong>74%</strong></div><div class="stats-kpi"><span>Средняя оценка</span><strong>3,8</strong></div></div><h2 class="section-heading" style="margin-top:23px">Результаты группы</h2><table class="result-table"><thead><tr><th>Студент</th><th>Верно</th><th>Результат</th><th>Оценка</th></tr></thead><tbody><tr><td>Иван Петров</td><td>23 / 25</td><td>92%</td><td class="status-pass">Отлично</td></tr><tr><td>Мария Соколова</td><td>21 / 25</td><td>84%</td><td class="status-pass">Хорошо</td></tr><tr><td>Алексей Ким</td><td>18 / 25</td><td>72%</td><td class="status-pass">Хорошо</td></tr><tr><td>Ольга Смирнова</td><td>12 / 25</td><td>48%</td><td class="status-fail">Не сдано</td></tr></tbody></table><div class="exam-actions"><span class="hint">Демонстрационная статистика сессии · группа ${activeExam.group}.</span><button class="secondary" onclick="examPage('session')">Посмотреть сессию студента</button></div></section>`;document.querySelectorAll('.mode-tab').forEach(tab=>tab.classList.toggle('active',tab.textContent==='Результаты'));}
    function placeholder(title){content.innerHTML=`<section class="placeholder"><h1>${title}</h1><p>Раздел пока находится в разработке.</p></section>`;}
    function toggleCollapse(){const collapsed=document.getElementById('sidebar').classList.toggle('collapsed');document.getElementById('collapse-icon').innerHTML=icon(collapsed?'chevronRight':'chevronLeft');}
    function toggleMenu(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('overlay').classList.toggle('show',open);}
    let toastTimer;function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}
    function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    updateProfileChrome();
    home();
  </script>
