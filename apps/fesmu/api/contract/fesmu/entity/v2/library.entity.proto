syntax = "proto3";

package contract.entity.v2;

import "google/protobuf/timestamp.proto";
import "fesmu/enum/v2/library.enum.proto";

option go_package = "entity_v2;entity_pb";

// A file kept by the files service on the library's behalf (an edition, a
// manual's figure or attachment). The api hands out only files it registered.
message LibraryFile {
  int64 id = 1; // id in the files service
  string name = 2;
  string mime_type = 3;
  int64 size = 4;
}

// A catalog entry. Discipline is typed by hand for now.
message LibraryItem {
  int64 id = 1;
  contract.enum.v2.LibraryItemKind kind = 2;
  string title = 3;
  string authors = 4;
  int32 year = 5;
  string publisher = 6;
  string description = 7;
  string discipline = 8;
  LibraryFile file = 9; // KIND_FILE
  string url = 10;      // KIND_LINK
  string created_by = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// ── Manual blocks ─────────────────────────────────────────────────────────
// A manual is sections of blocks. Each block kind is one universal component
// on the page (view for the reader, edit for the editor); a new kind is a
// message here, a case in the oneof and a component in shared/blocks.

message ManualBlock {
  string id = 1; // stable within the manual: reader positions point at it
  oneof body {
    ManualHeadingBlock heading = 10;
    ManualTextBlock text = 11;
    ManualFigureBlock figure = 12;
    ManualTableBlock table = 13;
    ManualCalloutBlock callout = 14;
    ManualVideoBlock video = 15;
    ManualAttachmentBlock attachment = 16;
    ManualCaseBlock clinical_case = 17;
    ManualQuizBlock quiz = 18;
    ManualChecklistBlock checklist = 19;
    ManualGlossaryBlock glossary = 20;
    ManualLiteratureBlock literature = 21;
    ManualDividerBlock divider = 22;
  }
}

message ManualHeadingBlock {
  string text = 1;
  int32 level = 2; // 2–4; level 1 is the section title
}

// Paragraphs with light markup: **жирный**, *курсив*, [ссылка](https://…),
// lines starting "- " or "1. " are lists, a blank line splits paragraphs.
message ManualTextBlock {
  string text = 1;
}

message ManualFigureBlock {
  LibraryFile file = 1;
  string caption = 2;
  string source = 3;
}

message ManualTableRow {
  repeated string cells = 1;
}

message ManualTableBlock {
  string caption = 1;
  bool header = 2; // the first row is the header
  repeated ManualTableRow rows = 3;
}

message ManualCalloutBlock {
  contract.enum.v2.ManualCalloutTone tone = 1;
  string title = 2;
  string text = 3; // same markup as ManualTextBlock
}

// A link to a video (RuTube, VK Video, YouTube) — embedded when the host is
// known, a plain link otherwise.
message ManualVideoBlock {
  string url = 1;
  string caption = 2;
}

message ManualAttachmentBlock {
  LibraryFile file = 1;
  string title = 2;
}

// Ситуационная задача: условие и вопросы открыты, эталон ответа — по кнопке.
message ManualCaseBlock {
  string title = 1;
  string condition = 2;
  repeated string questions = 3;
  string answer = 4;
}

message ManualQuizQuestion {
  string text = 1;
  repeated string options = 2;
  repeated int32 correct = 3; // indexes into options; several — multiple choice
  string explanation = 4;
}

// Self-check right in the text; answers are checked on the page, nothing is stored.
message ManualQuizBlock {
  string title = 1;
  repeated ManualQuizQuestion questions = 2;
}

// Алгоритм манипуляции, порядок действий.
message ManualChecklistBlock {
  string title = 1;
  bool ordered = 2;
  repeated string steps = 3;
}

message ManualGlossaryTerm {
  string term = 1;
  string definition = 2;
}

message ManualGlossaryBlock {
  repeated ManualGlossaryTerm terms = 1;
}

// Literature from the catalog; the items come with the manual (Manual.literature).
message ManualLiteratureBlock {
  string title = 1;
  repeated int64 item_ids = 2;
}

message ManualDividerBlock {}

// A topic of the manual: its title and blocks.
message ManualSection {
  string id = 1;
  string title = 2;
  repeated ManualBlock blocks = 3;
}

// A study manual for a discipline. In lists sections are left out.
message Manual {
  int64 id = 1;
  string discipline = 2;
  string title = 3;
  string specialty = 4;
  int32 course = 5;
  int32 semester = 6;
  string authors = 7;
  string annotation = 8;
  contract.enum.v2.ManualStatus status = 9;
  // The draft differs from the published version (editors only).
  bool draft_changed = 10;
  repeated ManualSection sections = 11;
  string updated_by = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp published_at = 14;
}

// Where a reader stopped in an edition or a manual.
message ReaderProgress {
  contract.enum.v2.ReaderSourceKind kind = 1;
  int64 ref_id = 2;
  // Adapter's own position: "page:12" for PDF, "block:<id>" for a manual.
  string position = 3;
  int32 percent = 4; // 0–100
  string title = 5;  // what is open, for "continue reading"
  google.protobuf.Timestamp updated_at = 6;
}
