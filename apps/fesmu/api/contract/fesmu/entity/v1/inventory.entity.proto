syntax = "proto3";

package contract.entity.v1;

import "google/protobuf/timestamp.proto";
import "fesmu/enum/v1/inventory.enum.proto";

option go_package = "entity_v1;entity_pb";

message Inventory {
  int64 id = 1;

  string title = 2;
  string description = 3;

  string inventory_number = 4;
  string serial_number = 5;

  double purchase_price = 6;
  google.protobuf.Timestamp purchase_date = 7;

  int64 infrastructure_id = 8;
  int64 responsible_user_id = 9;

  contract.enum.v1.InventoryStatus status = 10;
  contract.enum.v1.InventoryType type = 11;

  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}
