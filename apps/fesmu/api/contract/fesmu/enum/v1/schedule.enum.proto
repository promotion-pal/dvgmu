syntax = "proto3";

package contract.enum.v1;

option go_package = "enum_v1;enum_pb";

enum ScheduleEntryKind {
  SCHEDULE_ENTRY_KIND_UNSPECIFIED = 0;
  SCHEDULE_ENTRY_KIND_LECTURE = 1;
  SCHEDULE_ENTRY_KIND_PRACTICE = 2;
}

enum ScheduleWeeks {
  SCHEDULE_WEEKS_UNSPECIFIED = 0;
  SCHEDULE_WEEKS_EVERY = 1;
  SCHEDULE_WEEKS_NUMERATOR = 2;
  SCHEDULE_WEEKS_DENOMINATOR = 3;
}

enum SchedulePeriodKind {
  SCHEDULE_PERIOD_KIND_UNSPECIFIED = 0;
  SCHEDULE_PERIOD_KIND_STUDY = 1;
  SCHEDULE_PERIOD_KIND_PRACTICE = 2;
  SCHEDULE_PERIOD_KIND_SESSION = 3;
  SCHEDULE_PERIOD_KIND_HOLIDAY = 4;
}

enum ScheduleFormat {
  SCHEDULE_FORMAT_UNSPECIFIED = 0;
  SCHEDULE_FORMAT_WEEKLY = 1;
  SCHEDULE_FORMAT_CYCLES = 2;
}
