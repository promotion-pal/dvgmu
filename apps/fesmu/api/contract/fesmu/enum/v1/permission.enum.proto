syntax = "proto3";

package contract.enum.v1;

option go_package = "enum_v1;enum_pb";

// Права на портал строятся одинаково: "раздел.действие" — например
// "schedule.post". Строка — имя значения без префикса в нижнем регистре
// (PERMISSION_SECTION_COMPUTER_CLASSES → "computer_classes"); так права
// хранятся в MDM и приходят в токене. Из прав администратор собирает доступы
// («сотрудник отдела», Администрирование → Доступы).
//
// Новый раздел: значение здесь → buf generate → сервис раздела в
// authInterceptor.Sections (api), подпись и меню во фронте, кнопки изменения
// в <Can section={PermissionSection.X}>.

// PermissionSection — раздел портала.
enum PermissionSection {
  PERMISSION_SECTION_UNSPECIFIED = 0;
  // Корпуса, этажи, помещения.
  PERMISSION_SECTION_INFRASTRUCTURE = 1;
  // Учёт инвентаря.
  PERMISSION_SECTION_INVENTORY = 2;
  // Заявки общежития и хозяйственные.
  PERMISSION_SECTION_TICKETS = 3;
  // Расписание групп, сбор пожеланий.
  PERMISSION_SECTION_SCHEDULE = 4;
  // Расписание и бронирование лекционных залов.
  PERMISSION_SECTION_HALLS = 5;
  // Расписание компьютерных классов.
  PERMISSION_SECTION_COMPUTER_CLASSES = 6;
  // Дни и записи на вакцинацию.
  PERMISSION_SECTION_VACCINATION = 7;
  // Справки: просмотр — журнал; изменение — выдача, справка за любого студента.
  PERMISSION_SECTION_CERTIFICATE = 8;
  // Закупки v2 — по разделу на роль в процессе. Просмотр любого из них
  // открывает страницу закупок; изменение — действовать в этой роли.
  // Закупки: подача заявок (роль «Сотрудник»).
  PERMISSION_SECTION_PURCHASE_REQUEST = 9;
  // Закупки: начальник отдела — согласование, правка и объединение заявок, выбор проректора.
  PERMISSION_SECTION_PURCHASE_HEAD = 10;
  // Закупки: курирующий проректор — закупки из заявок, КП, комментарий для комиссии.
  PERMISSION_SECTION_PURCHASE_VICE_RECTOR = 11;
  // Закупки: экономический отдел — коды, источник финансирования, НМЦК.
  PERMISSION_SECTION_PURCHASE_ECONOMIST = 12;
  // Закупки: бюджетная комиссия — решения по ПФХД.
  PERMISSION_SECTION_PURCHASE_COMMISSION = 13;
  // Тесты: конструктор тестов, сессии тестирования и их результаты.
  PERMISSION_SECTION_TESTS = 14;
  // Библиотека: просмотр — каталог открыт всем, кто вошёл; изменение —
  // добавлять, править и удалять издания.
  PERMISSION_SECTION_LIBRARY = 15;
  // Методички: изменение — писать, править, публиковать методички по
  // дисциплинам; читать опубликованные может любой, кто вошёл.
  PERMISSION_SECTION_MANUALS = 16;
  // Аналитика: просмотр — результаты опросов (сводки, ответы, выгрузка);
  // изменение — заводить опросы и QR-точки.
  PERMISSION_SECTION_ANALYTICS = 17;
  // Деканат: просмотр — студенты своего факультета по группам и курсам;
  // изменение — выдача кодов первого входа (лист на группу для печати).
  PERMISSION_SECTION_DEANERY = 18;
}

// PermissionAction — что можно в разделе.
enum PermissionAction {
  PERMISSION_ACTION_UNSPECIFIED = 0;
  // Просмотр: раздел в меню, данные видны. В api — методы ...Fetch и ...ByID.
  PERMISSION_ACTION_FETCH = 1;
  // Изменение: добавить, править, удалить; включает просмотр. В api — остальные методы.
  PERMISSION_ACTION_POST = 2;
}
