syntax = "proto3";

package contract.entity;

option go_package = "entity;entity_pb";

import "packages/mdm/enum/doc.enum.proto";
import "google/protobuf/timestamp.proto";

message Military {
    int64 id = 1;
    int64 user_id = 2;

    string commissariat = 3;
    string vus_code = 4;
    
    contract.enum.MilitaryRank rank = 5;
    contract.enum.MilitaryDocument document = 6;
    contract.enum.MilitaryValidity validity = 7;

    bool has_deferment = 8;
    google.protobuf.Timestamp deferment_expires_at = 9;

    google.protobuf.Timestamp created_at = 10;
    google.protobuf.Timestamp updated_at = 11;
}