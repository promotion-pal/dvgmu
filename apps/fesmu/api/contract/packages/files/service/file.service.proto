syntax = "proto3";

package contract.file.service;

import "google/protobuf/timestamp.proto";
import "packages/files/entity/file.entity.proto";
import "packages/files/enum/file.enum.proto";
import "packages/mdm/entity/user.entity.proto";

option go_package = "service;service_pb";

service FilesService {
  rpc FileUpload (FileUploadRequest) returns (FileUploadResponse);
  rpc FileGenerate (FileGenerateRequest) returns (FileGenerateResponse);
  rpc FileDownload (FileDownloadRequest) returns (stream FileDownloadResponse);
 }

message FileUploadRequest {
  int64 user_id = 1;
  string file_name = 2;
  contract.file.enum.FileType type = 3;
  bytes content = 4;
}

message FileUploadResponse {
  bool success = 1;
  string message = 2;
  contract.file.entity.File file = 3;
  repeated contract.entity.User employees = 4;
  repeated ParsedStudent students = 5;
}

message ParsedStudent {
  contract.entity.UserFull profile = 1;
  RawStudentValues raw = 2;
}

message RawStudentValues {
  string birthday = 1;
  string gender = 2;
  string nationality = 3;
  string passport_series_number = 4;
  string education_type = 5;
  string education_series_number = 6;
  string education_issue_date = 7;
  string education_form = 8;
  string status = 9;
  string needs_dormitory = 10;
  string military_rank = 11;
  string military_registration_certificate = 12;
  string military_ticket = 13;
}

// FileGenerateRequest renders one document. `profile` is MDM's own UserFull
// (contract/packages/mdm), so the generator reads exactly the fields MDM
// defines; `type` picks the template and which `params` variant it needs.
message FileGenerateRequest {
  contract.entity.UserFull profile = 1;
  contract.file.enum.FileGenerateType type = 2;

  oneof params {
    // WORD_GEN_APPLICATION_DORMITORY, ..._DORMITORY_STUDENT_FULL (also needs
    // dormitory_address), ..._DORMITORY_ABITUR
    DormitoryApplicationParams dormitory_application = 3;
    // WORD_GEN_APPLICATION_TEMPORARY_RESIDENCE
    TemporaryResidenceParams temporary_residence = 4;
    // WORD_GEN_MILITARY_REGISTRATION_CARD needs no params: profile only.
  }
}

// Data the dormitory applications need that MDM's profile doesn't carry.
message DormitoryApplicationParams {
  int32 room = 1;
  int32 building = 2;
  string period_from = 3;
  string period_to = 4;
  // Building address; required only for DORMITORY_STUDENT_FULL.
  string dormitory_address = 5;
}

message TemporaryResidenceParams {
  string period_from = 1;
  string period_to = 2;
  string official = 3;
  string room_owner = 4;
  string room_owner_position = 5;
}

// The generated document comes back in the same call; nothing is stored.
message FileGenerateResponse {
  bool success = 1;
  string message = 2;
  contract.file.entity.File file = 3;
  bytes content = 4;
}

message FileDownloadRequest {
  int64 id = 1;
}

message FileDownloadResponse {
  bytes chunk_content = 1;
}
