syntax = "proto3";

package contract.service.v2;

import "enum/v2/library.enum.proto";
import "entity/v2/library.entity.proto";

option go_package = "service_v2;service_pb";

// Library: the catalog of editions, study manuals by discipline and the
// reader's progress. Anyone signed in reads the catalog and published
// manuals; changing the catalog takes library.post, writing manuals —
// manuals.post. Files go to the files service (library/books,
// library/manuals) and come back only through LibraryFileFetch.
service LibraryService {
    rpc LibraryItemFetch (LibraryItemFetchRequest) returns (LibraryItemFetchResponse);
    rpc LibraryItemByID (LibraryItemByIDRequest) returns (LibraryItemByIDResponse);
    rpc LibraryItemCreate (LibraryItemCreateRequest) returns (LibraryItemCreateResponse);
    rpc LibraryItemUpdate (LibraryItemUpdateRequest) returns (LibraryItemUpdateResponse);
    rpc LibraryItemDelete (LibraryItemDeleteRequest) returns (LibraryItemDeleteResponse);

    // Disciplines named in the catalog and in manuals, for suggestions and filters.
    rpc LibraryDisciplineFetch (LibraryDisciplineFetchRequest) returns (LibraryDisciplineFetchResponse);

    // A figure or attachment for a manual (manuals.post).
    rpc LibraryFileUpload (LibraryFileUploadRequest) returns (LibraryFileUploadResponse);
    rpc LibraryFileFetch (LibraryFileFetchRequest) returns (LibraryFileFetchResponse);

    rpc ManualFetch (ManualFetchRequest) returns (ManualFetchResponse);
    rpc ManualByID (ManualByIDRequest) returns (ManualByIDResponse);
    rpc ManualCreate (ManualCreateRequest) returns (ManualCreateResponse);
    // Saves the draft: meta and sections.
    rpc ManualUpdate (ManualUpdateRequest) returns (ManualUpdateResponse);
    // The draft becomes the published version.
    rpc ManualPublish (ManualPublishRequest) returns (ManualPublishResponse);
    // Takes the manual off publication; the draft stays.
    rpc ManualArchive (ManualArchiveRequest) returns (ManualArchiveResponse);
    rpc ManualDelete (ManualDeleteRequest) returns (ManualDeleteResponse);

    // The signed-in user's own reading positions.
    rpc ReaderProgressFetch (ReaderProgressFetchRequest) returns (ReaderProgressFetchResponse);
    rpc ReaderProgressSave (ReaderProgressSaveRequest) returns (ReaderProgressSaveResponse);
}

message LibraryItemFetchRequest {
    string query = 1;      // title, authors, description
    string discipline = 2; // exact; empty — any
}

message LibraryItemFetchResponse {
    repeated contract.entity.v2.LibraryItem items = 1;
}

message LibraryItemByIDRequest {
    int64 id = 1;
}

message LibraryItemByIDResponse {
    contract.entity.v2.LibraryItem item = 1;
}

// What a catalog entry says about itself; the file goes alongside.
message LibraryItemInput {
    contract.enum.v2.LibraryItemKind kind = 1;
    string title = 2;
    string authors = 3;
    int32 year = 4;
    string publisher = 5;
    string description = 6;
    string discipline = 7;
    string url = 8; // KIND_LINK
}

message LibraryItemCreateRequest {
    LibraryItemInput item = 1;
    // KIND_FILE: required.
    string file_name = 2;
    bytes file_content = 3;
}

message LibraryItemCreateResponse {
    int64 id = 1;
}

message LibraryItemUpdateRequest {
    int64 id = 1;
    LibraryItemInput item = 2;
    // A new file for KIND_FILE; empty — keep the current one.
    string file_name = 3;
    bytes file_content = 4;
}

message LibraryItemUpdateResponse {}

message LibraryItemDeleteRequest {
    int64 id = 1;
}

message LibraryItemDeleteResponse {}

message LibraryDisciplineFetchRequest {}

message LibraryDisciplineFetchResponse {
    repeated string disciplines = 1;
}

message LibraryFileUploadRequest {
    string file_name = 1;
    bytes content = 2;
}

message LibraryFileUploadResponse {
    contract.entity.v2.LibraryFile file = 1;
}

message LibraryFileFetchRequest {
    int64 id = 1;
}

message LibraryFileFetchResponse {
    contract.entity.v2.LibraryFile file = 1;
    bytes content = 2;
}

message ManualFetchRequest {
    string discipline = 1; // exact; empty — any
    string query = 2;      // title, authors, annotation
}

// Editors get drafts and archived manuals too; others — published only.
message ManualFetchResponse {
    repeated contract.entity.v2.Manual manuals = 1;
}

message ManualByIDRequest {
    int64 id = 1;
    // The editors' draft instead of the published version (manuals.post).
    bool draft = 2;
}

message ManualByIDResponse {
    contract.entity.v2.Manual manual = 1;
    // Catalog entries the literature blocks point at.
    repeated contract.entity.v2.LibraryItem literature = 2;
}

message ManualInput {
    string discipline = 1;
    string title = 2;
    string specialty = 3;
    int32 course = 4;
    int32 semester = 5;
    string authors = 6;
    string annotation = 7;
}

message ManualCreateRequest {
    ManualInput manual = 1;
}

message ManualCreateResponse {
    int64 id = 1;
}

message ManualUpdateRequest {
    int64 id = 1;
    ManualInput manual = 2;
    repeated contract.entity.v2.ManualSection sections = 3;
}

message ManualUpdateResponse {}

message ManualPublishRequest {
    int64 id = 1;
}

message ManualPublishResponse {}

message ManualArchiveRequest {
    int64 id = 1;
}

message ManualArchiveResponse {}

message ManualDeleteRequest {
    int64 id = 1;
}

message ManualDeleteResponse {}

// ref_id 0 — the latest positions across everything, newest first.
message ReaderProgressFetchRequest {
    contract.enum.v2.ReaderSourceKind kind = 1;
    int64 ref_id = 2;
}

message ReaderProgressFetchResponse {
    repeated contract.entity.v2.ReaderProgress progress = 1;
}

message ReaderProgressSaveRequest {
    contract.enum.v2.ReaderSourceKind kind = 1;
    int64 ref_id = 2;
    string position = 3;
    int32 percent = 4;
}

message ReaderProgressSaveResponse {}
