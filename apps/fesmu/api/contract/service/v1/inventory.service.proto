syntax = "proto3";

package contract.service.v1;

import "enum/v1/inventory.enum.proto";
import "entity/v1/inventory.entity.proto";
import "google/protobuf/timestamp.proto";

option go_package = "service_v1;service_pb";

service InventoryService {
    rpc InventoryFetch (InventoryFetchRequest) returns (InventoryFetchResponse);
    rpc InventoryCreate (InventoryCreateRequest) returns (InventoryCreateResponse);
    rpc InventoryByID (InventoryByIDRequest) returns (InventoryByIDResponse);
    rpc InventoryUpdate (InventoryUpdateRequest) returns (InventoryUpdateResponse);
    rpc InventoryDelete (InventoryDeleteRequest) returns (InventoryDeleteResponse);
}

message InventoryFetchRequest {
}

message InventoryFetchResponse {
    repeated contract.entity.v1.Inventory list = 1;
}

message InventoryCreateRequest {
    string title = 1;
    string description = 2;

    string inventory_number = 3;
    string serial_number = 4;

    double purchase_price = 5;
    google.protobuf.Timestamp purchase_date = 6;

    int64 infrastructure_id = 7;
    int64 responsible_user_id = 8;

    contract.enum.v1.InventoryStatus status = 9;
    contract.enum.v1.InventoryType type = 10;
}

message InventoryCreateResponse {
    bool success = 1;
    string message = 2;
    int64 inventory_id = 3;
}

message InventoryByIDRequest {
    int64 id = 1;
}

message InventoryByIDResponse {
    contract.entity.v1.Inventory entity = 1;
}

message InventoryUpdateRequest {
    int64 id = 1;

    string title = 2;
    string description = 3;

    string inventory_number = 4;
    string serial_number = 5;

    double purchase_price = 6;
    google.protobuf.Timestamp purchase_date = 7;

    int64 infrastructure_id = 8;
    int64 responsible_user_id = 9;

    contract.enum.v1.InventoryStatus status = 10;
    contract.enum.v1.InventoryType type = 11;
}

message InventoryUpdateResponse {
    bool success = 1;
    string message = 2;
}

message InventoryDeleteRequest {
    int64 id = 1;
}

message InventoryDeleteResponse {
    bool success = 1;
    string message = 2;
}
