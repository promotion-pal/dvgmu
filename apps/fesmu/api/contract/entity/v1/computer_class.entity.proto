syntax = "proto3";

package contract.entity.v1;

import "google/protobuf/timestamp.proto";
import "enum/v1/computer_class.enum.proto";

option go_package = "entity_v1;entity_pb";

// ComputerClassSession is one slot of a computer class's timetable: a lesson
// or computer testing held in a room on a date, from time_start to time_end.
// Slots of one room may overlap: the timetable shows the clash so staff fix it.
message ComputerClassSession {
  int64 id = 1;

  // ISO date (YYYY-MM-DD).
  string date = 2;
  // HH:MM, time_start < time_end.
  string time_start = 3;
  string time_end = 4;
  // The computer class, e.g. "ауд. 305 (учебный корпус № 1)".
  string room = 5;

  // What takes place, e.g. "Тестирование по анатомии".
  string title = 6;
  // Who takes it, free text, e.g. "Лечебное дело, 1 курс, 101–104".
  string groups = 7;
  string note = 8;

  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;

  // Lesson or testing.
  contract.enum.v1.ComputerClassSessionKind kind = 11;
}
