# Контракт fesmu вместе со схемами сервисов, в которые он ходит (proto/<имя>,
# --include-imports): Go — внутрь api (собирается из своей папки), TS — в общий
# @dvgmu/contract. Запуск — scripts/contracts.sh gen (из корня монорепо).
version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: dvgmu/api/contract/gen/go

plugins:
  - local: protoc-gen-go
    out: apps/fesmu/api/contract/gen/go
    opt: paths=source_relative

  - local: protoc-gen-connect-go
    out: apps/fesmu/api/contract/gen/go
    opt: paths=source_relative

  - local: protoc-gen-es
    out: packages/contract
    opt: target=ts
