name: dvgmu

services:
  dvgmu:
    image: dvgmu:latest
    container_name: dvgmu
    build:
      context: ../..
      dockerfile: apps/lk/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network
      - traefik.http.routers.dvgmu-secure.rule=Host(`${APP_DOMAIN:-api.core.fesmu.ru}`) && !PathPrefix(`/api`)
      - traefik.http.routers.dvgmu-secure.priority=50
      - traefik.http.routers.dvgmu-secure.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}
      - traefik.http.routers.dvgmu-secure.tls=true
      - traefik.http.routers.dvgmu-secure.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.dvgmu-secure.service=dvgmu
      - traefik.http.services.dvgmu.loadbalancer.server.port=80

networks:
  traefik-network:
    external: true
