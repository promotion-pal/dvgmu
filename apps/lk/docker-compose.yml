services:
  dvgmu_lk:
    container_name: dvgmu_lk
    build:
      context: ../..
      dockerfile: apps/lk/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        VITE_GATEWAY_URL: ${VITE_PROD_GATEWAY_URL:-https://api.core.fesmu.ru}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network
      - traefik.http.routers.fesmu-core-app-secure.rule=Host(`${APP_DOMAIN:-api.core.fesmu.ru}`)
      - traefik.http.routers.fesmu-core-app-secure.priority=1
      - traefik.http.routers.fesmu-core-app-secure.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}
      - traefik.http.routers.fesmu-core-app-secure.tls=true
      - traefik.http.routers.fesmu-core-app-secure.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.fesmu-core-app-secure.service=fesmu-core-app
      - traefik.http.services.fesmu-core-app.loadbalancer.server.port=80

networks:
  traefik-network:
    external: true
