syntax = "proto3";

package contract.analytics.entity;

option go_package = "entity;entity_pb";

import "enum/analytic.enum.proto";
import "google/protobuf/timestamp.proto";

message Analytic {
    int64 id = 1;

    int64 qr = 2;
    string name = 3;
    string transcript = 4;
    contract.analytics.enum.AnalyticType type = 5;
    repeated AnalyticRating ratings = 6;

    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
}

message AnalyticRating {
  int64 id = 1;
  int64 analytic_id = 2;

  string comment = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;

  reserved 18, 19; // бывшие information_security_full_name / information_security_office
  reserved 24, 28, 31; // бывшие information_security_nda_signed / _access_method / _pdn_archive_processing
  reserved "information_security_nda_signed", "information_security_access_method", "information_security_pdn_archive_processing";

  // --- ОБЩИЙ БЛОК: РЕСПОНДЕНТ (для всех опросников) ---
  string respondent_last_name = 46;   // Фамилия
  string respondent_first_name = 47;  // Имя
  string respondent_middle_name = 48; // Отчество
  string respondent_office = 49;      // Кабинет
  string respondent_department = 50;  // Отдел

  // --- БЛОК ОЦЕНКИ РАБОЧЕГО ПРОСТРАНСТВА (WORKPLACE) ---
  int32 workplace_pc_power_rating = 6;       // Мощность ПК для работы без зависаний
  int32 workplace_os_boot_rating = 7;        // Скорость загрузки ОС и приложений
  int32 workplace_software_stable_rating = 8; // Стабильность корпоративных программ (без вылетов)
  int32 workplace_network_speed_rating = 9;   // Скорость интернет-соединения и сети
  int32 workplace_monitor_rating = 10;       // Удобство монитора (размер, разрешение, яркость)
  int32 workplace_keyboard_mouse_rating = 11; // Качество и удобство клавиатуры и мыши
  int32 workplace_media_devices_rating = 12;  // Работа наушников/гарнитуры и веб-камеры
  int32 workplace_office_equipment_rating = 13; // Быстрый доступ к принтеру/сканеру
  int32 workplace_furniture_rating = 14;     // Удобство кресла и стола для длительной работы
  int32 workplace_space_org_rating = 15;     // Организация пространства (розетки, провода, место)
  int32 workplace_environment_rating = 16;   // Условия рядом с ПК (свет, температура, шум)
  bool workplace_has_network = 17;   // Наличие интернета

  // --- БЛОК ИНФОРМАЦИОННОЙ БЕЗОПАСНОСТИ (INFORMATION_SECURITY) ---
  string information_security_position = 20;    // 3. Должность
  int32  information_security_computer_proficiency = 35; // Уровень владения ПК (1–5)
  contract.analytics.enum.InformationSecurityInfoType information_security_info_type = 21;
  // 5. Информационные ресурсы — несколько значений в порядке выбора
  repeated contract.analytics.enum.InformationSecurityResource information_security_resources = 22;
  string information_security_resources_other = 51; // 5a. Другие ресурсы/программы, вписанные вручную
  string information_security_pdn_purpose = 23;   // 6. Цель обработки персональных данных
  string information_security_storage_form = 25;   // 8. В каком виде ведётся обработка (на бумаге / на компьютере)
  string information_security_pdn_actions = 26;    // 9. Какие действия выполняются над ПДн
  bool   information_security_third_party_agreements = 27; // 10. Передача ПДн в другие организации
  bool   information_security_pdn_destroyed_after_term = 29; // 12. Уничтожение ПДн после истечения сроков обработки
  bool   information_security_pdn_to_archive = 30; // 13. Передаются ли ПДн в архив
  contract.analytics.enum.InformationSecurityOs information_security_os = 32;

  bool information_security_has_corporate_email = 33;          // 16. Есть ли у сотрудника корпоративная почта
  bool information_security_corporate_email_personal_use = 34; // 17. Использует ли корпоративную почту в личных целях

  // --- БЛОК ТЕХНИЧЕСКОГО СНАБЖЕНИЯ (TECHNICAL_SUPPLY) ---
  bool technical_supply_has_internet = 36;        // Наличие интернета
  bool technical_supply_has_headset = 37;         // Наличие гарнитуры
  bool technical_supply_has_workplace = 38;       // Наличие полноценного рабочего места
  bool technical_supply_has_corporate_email = 39; // Наличие корпоративной почты
  bool technical_supply_has_computer = 40;        // Наличие рабочего компьютера
  bool technical_supply_has_monitor = 41;         // Наличие монитора
  bool technical_supply_has_phone = 42;           // Наличие рабочего телефона
  bool technical_supply_has_printer_access = 43;  // Наличие доступа к принтеру/сканеру
  bool technical_supply_has_software = 44;        // Наличие необходимого программного обеспечения
  bool technical_supply_has_domain_account = 45;  // Наличие доменной учётной записи

  // Туалет (AnalyticType TOILET)
  int32 purity_rating = 52;   // Чистота (1–5)
  int32 smell_rating = 53;    // Запах (1–5)
  bool has_toilet_paper = 54; // Есть туалетная бумага
  bool has_soap = 55;         // Есть мыло

  // Лекционный зал (AnalyticType LECTURE)
  int32 comfort = 56;     // Комфорт (1–5)
  int32 equipment = 57;   // Оснащение (1–5)
  int32 cleanliness = 58; // Чистота (1–5)
}