syntax = "proto3";

package contract.analytics.service;

import "entity/ip.entity.proto";
import "google/protobuf/timestamp.proto";

option go_package = "service;service_pb";

service IpService {
    rpc IpCheck (IpCheckRequest) returns (IpCheckResponse);
    rpc IpCreate (IpCreateRequest) returns (IpCreateResponse);
    rpc IpFetch (IpFetchRequest) returns (stream IpFetchResponse);
}

message IpCheckRequest {
    int64 analytic_id = 1;
    string ip = 2;
}

message IpCheckResponse {
    bool allowed = 1;
    google.protobuf.Timestamp retry_after = 2;
}

message IpCreateRequest {
    int64 analytic_id = 1;
    string ip = 2;
}

message IpCreateResponse {
    int64 id = 1;
    bool success = 2;
    string message = 3;
}

message IpFetchRequest {
    optional int64 analytic_id = 1;
    optional string ip = 2;
    optional google.protobuf.Timestamp start_date = 3;
    optional google.protobuf.Timestamp end_date = 4;
}

message IpFetchResponse {
    contract.analytics.entity.IpEntry entity = 1;
}
