syntax = "proto3";

package contract.analytics.enum;

option go_package = "enum;enum_pb";

enum AnalyticType {
    ANALYTIC_TYPE_UNKNOWN = 0;
    ANALYTIC_TYPE_TOILET = 1;
    ANALYTIC_TYPE_LECTURE = 2;
    ANALYTIC_TYPE_WORKPLACE = 3;
    ANALYTIC_TYPE_INFORMATION_SECURITY = 4;
    ANALYTIC_TYPE_TECHNICAL_SUPPLY = 5;
}

// Вид информации ограниченного доступа, с которой работает сотрудник (вопрос 4).
enum InformationSecurityInfoType {
    INFORMATION_SECURITY_INFO_TYPE_UNSPECIFIED = 0;
    INFORMATION_SECURITY_INFO_TYPE_DSP = 1;          // Для служебного пользования
    INFORMATION_SECURITY_INFO_TYPE_PDN = 2;          // Персональные данные
    INFORMATION_SECURITY_INFO_TYPE_DSP_AND_PDN = 3;  // Для служебного пользования и персональные данные
    INFORMATION_SECURITY_INFO_TYPE_NONE = 4;         // Не работаю с информацией ограниченного доступа
}

// Информационные ресурсы, с которыми работает сотрудник (вопрос 5).
enum InformationSecurityResource {
    INFORMATION_SECURITY_RESOURCE_UNSPECIFIED = 0;
    INFORMATION_SECURITY_RESOURCE_FIS_GIA_PRIEM = 1;   // ФИС ГИА и приёма
    INFORMATION_SECURITY_RESOURCE_ONE_C = 2;           // 1С
    INFORMATION_SECURITY_RESOURCE_ROSIMUSHCHESTVO = 3; // Росимущество
    INFORMATION_SECURITY_RESOURCE_ELECTRONIC_BUDGET = 4; // Электронный бюджет
    INFORMATION_SECURITY_RESOURCE_GIS_FRDO_SPO = 5;    // ГИС ФРДО СПО
    INFORMATION_SECURITY_RESOURCE_FRDO_VO = 6;         // ФРДО ВО
    INFORMATION_SECURITY_RESOURCE_SMEV = 7;            // СМЭВ
    INFORMATION_SECURITY_RESOURCE_TRUD_ROSSII = 8;     // Труд России
    INFORMATION_SECURITY_RESOURCE_FRMR = 9;            // ФРМР
    INFORMATION_SECURITY_RESOURCE_FRMO = 10;           // ФРМО
    INFORMATION_SECURITY_RESOURCE_EGISU_NIOKTR = 11;   // ЕГИСУ НИОКТР
    INFORMATION_SECURITY_RESOURCE_MIS_MEDIALOG = 12;   // МИС Медиолог
    INFORMATION_SECURITY_RESOURCE_SFR = 13;            // СФР
}

// Операционная система на рабочем месте (вопрос 15).
enum InformationSecurityOs {
    INFORMATION_SECURITY_OS_UNSPECIFIED = 0;
    INFORMATION_SECURITY_OS_ASTRA = 1;   // Astra Linux
    INFORMATION_SECURITY_OS_WINDOWS = 2; // Windows
    INFORMATION_SECURITY_OS_RED_OS = 3;  // РЭД ОС
}
