services:
  dvgmu_auth_db:
    image: postgres:17
    container_name: dvgmu_auth_db
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-root}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME:-dvgmu_auth_db}
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - auth-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dvgmu_auth:
    container_name: dvgmu_auth
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    depends_on:
      dvgmu_auth_db:
        condition: service_healthy
    environment:
      AUTH_PORT: "4000"
      AUTH_PROVIDER: ${AUTH_PROVIDER:-test-db}
      AUTH_MDM_URL: http://dvgmu_mdm_api:4000
      AUTH_MDM_INTERNAL_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      DB_HOST: dvgmu_auth_db
      DB_PORT: "5432"
      DB_USER: ${AUTH_DB_USER:-root}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
      DB_NAME: ${AUTH_DB_NAME:-dvgmu_auth_db}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ISSUER: dvgmu-auth
    networks:
      - auth-data
      - dvgmu-backend
    restart: unless-stopped

volumes:
  auth_pgdata:

networks:
  auth-data:
    internal: true
  dvgmu-backend:
    external: true
    name: dvgmu-backend
