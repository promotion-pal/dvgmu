services:
  dvgmu_auth_db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-root}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-password}
      POSTGRES_DB: ${AUTH_DB_NAME:-dvgmu_auth_db}
    ports:
      - "${AUTH_DB_PORT:-5448}:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dvgmu_auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    ports:
      - "${AUTH_PORT:-4053}:4053"
    depends_on:
      dvgmu_auth_db:
        condition: service_healthy
    environment:
      AUTH_PORT: "4053"
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-auth-test-db}
      AUTH_MDM_URL: ${AUTH_MDM_URL:-http://host.docker.internal:4051}
      DB_HOST: dvgmu_auth_db
      DB_PORT: "5432"
      DB_USER: ${AUTH_DB_USER:-root}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-password}
      DB_NAME: ${AUTH_DB_NAME:-dvgmu_auth_db}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: dvgmu-auth
      AUTH_MDM_INTERNAL_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  auth_pgdata:
