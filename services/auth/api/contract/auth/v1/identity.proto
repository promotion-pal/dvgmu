syntax = "proto3";

// API v1 — ЗАМОРОЖЕН. Только для старых клиентов (services/sync), новых
// методов сюда не добавлять — всё новое идёт в auth/v2.
//
// Имя пакета оставлено прежним (contract.auth.service), а не auth.v1:
// оно входит в URL RPC (/contract.auth.service.IdentityService/List), и
// sync зовёт именно его. Номера полей тоже совпадают со старым контрактом.
// Удалить файл, когда sync переедет на contract.auth.v2.
package contract.auth.service;

import "auth/v1/identity_entity.proto";

// IdentityService — auth как связующее звено между AD и MDM: по objectGUID
// из AD-логина отдаёт связанную запись MDM (mdm_id).
service IdentityService {
    option deprecated = true;

    rpc ByGUID (IdentityByGUIDRequest) returns (IdentityResponse);
    rpc List (IdentityListRequest) returns (IdentityListResponse);
    // LinkMDM — записать связку object_guid ↔ mdm_id. Требует внутренний
    // секрет в теле запроса (internal_token == AUTH_INTERNAL_TOKEN).
    rpc LinkMDM (LinkMDMRequest) returns (LinkMDMResponse);
}

message IdentityByGUIDRequest {
    string object_guid = 1;
}

message IdentityResponse {
    contract.auth.entity.Identity identity = 1;
}

message IdentityListRequest {
    int32 page_size = 1;
    // page_token — непрозрачная строка из next_page_token прошлого ответа.
    string page_token = 2;
}

message IdentityListResponse {
    repeated contract.auth.entity.Identity identities = 1;
    // Пусто — страниц больше нет.
    string next_page_token = 2;
}

message LinkMDMRequest {
    string object_guid = 1;
    int64 mdm_id = 2;
    string internal_token = 3;
}

message LinkMDMResponse {
    bool success = 1;
}
