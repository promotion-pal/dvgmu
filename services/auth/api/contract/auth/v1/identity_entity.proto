syntax = "proto3";

// Сущность API v1 — заморожена вместе с auth/v1/identity.proto.
package contract.auth.entity;

import "google/protobuf/timestamp.proto";

message Identity {
    int64 id = 1;
    int64 mdm_id = 2;
    string email = 3;
    string object_guid = 4;
    google.protobuf.Timestamp synced_at = 5;
}
