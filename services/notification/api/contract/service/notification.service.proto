syntax = "proto3";

package contract.notification.service;

import "entity/notification.entity.proto";

option go_package = "service;service_pb";

service NotificationService {
    rpc NotificationSend (NotificationSendRequest) returns (NotificationSendResponse);
}

message NotificationSendRequest {
    contract.notification.entity.NotificationMessage message = 1;
}

message NotificationSendResponse {
    bool success = 1;
    string message = 2;
}
