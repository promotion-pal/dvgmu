syntax = "proto3";

package contract.dormitory.entity;

option go_package = "entity;entity_pb";

import "google/protobuf/timestamp.proto";

message DormitoryRegistration {
  int64 id = 1;
  int64 user_id = 2;

  int32 room = 3;
  string record_book = 4;
  google.protobuf.Timestamp data = 5;

  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp created_at = 7;
}