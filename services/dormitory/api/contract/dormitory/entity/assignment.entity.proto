syntax = "proto3";

package contract.dormitory.entity;

option go_package = "entity;entity_pb";

import "google/protobuf/timestamp.proto";
import "dormitory/enum/assignment.enum.proto";

message Assignment {
  int64 id = 1;
  int64 user_id = 2;

  string title = 3;
  string description = 4;
  contract.dormitory.enum.AssignmentStatus status = 5;

  bool requires_appearance = 6;
  optional google.protobuf.Timestamp appointment_at = 7;

  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp deadline_at = 10;
}