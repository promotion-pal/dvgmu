name: dvgmu_apps_wiki

services:
  dvgmu_apps_wiki_web:
    container_name: "dvgmu_apps_wiki_web"
    image: "dvgmu_apps_wiki_web:latest"
    build:
      context: "."
      dockerfile: "Dockerfile"
      network: host
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.wiki-secure.rule=Host(`wiki.dvgmu.promotion-pal.ru`)"
      - "traefik.http.routers.wiki-secure.entrypoints=websecure"
      - "traefik.http.routers.wiki-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.wiki-web.loadbalancer.server.port=80"

networks:
  traefik-network:
    external: true
