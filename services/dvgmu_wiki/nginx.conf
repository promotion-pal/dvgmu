server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаём index.html (Flutter-роутинг на клиенте)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # статика с длинным кешем, index.html — без кеша
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|wasm|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
