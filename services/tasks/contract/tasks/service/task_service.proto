syntax = "proto3";

package tasks.service;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "tasks/entity/service_form.proto";
import "tasks/entity/task.proto";

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc ListMyTasks(ListMyTasksRequest) returns (ListMyTasksResponse);
  rpc GetMyTask(GetMyTaskRequest) returns (GetMyTaskResponse);
  rpc GetMyTaskHistory(GetMyTaskHistoryRequest) returns (GetMyTaskHistoryResponse);
  // Requires a personal view grant for the requested queue.
  rpc ListQueueTasks(ListQueueTasksRequest) returns (ListQueueTasksResponse);
}

message CreateTaskRequest {
  int64 service_id = 1;
  string title = 2;
  string description = 3;
  // Use 0 when the service has no saved form.
  int64 form_version = 4;
  google.protobuf.Struct extra_fields = 5;
  // Required. Reuse for retries of the same submission, scoped to the applicant.
  string idempotency_key = 6;
}

message CreateTaskResponse {
  tasks.entity.Task task = 1;
}

message MyTasksCursor {
  google.protobuf.Timestamp created_at = 1;
  string uuid = 2;
}

message ListMyTasksRequest {
  // Defaults to 50 and accepts up to 100 tasks per page.
  int32 page_size = 1;
  // Use the previous page's next_cursor with the same filters.
  MyTasksCursor after = 2;
  optional int64 service_id = 3;
  optional int64 status_id = 4;
  optional int64 priority_id = 5;
  // Inclusive start and exclusive end of the creation period.
  google.protobuf.Timestamp created_from = 6;
  google.protobuf.Timestamp created_before = 7;
}

message MyTaskListItem {
  string uuid = 1;
  string number = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  int64 service_id = 5;
  string service_name = 6;
  int64 status_id = 7;
  string status_name = 8;
  int64 priority_id = 9;
  string priority_name = 10;
}

message ListMyTasksResponse {
  // Ordered by creation time and UUID, newest first.
  repeated MyTaskListItem tasks = 1;
  MyTasksCursor next_cursor = 2;
}

message GetMyTaskRequest {
  string uuid = 1;
}

message GetMyTaskResponse {
  tasks.entity.Task task = 1;
  string service_name = 2;
  string status_name = 3;
  string priority_name = 4;
  // The form version recorded on the task. Absent if submitted without a saved form.
  tasks.entity.ServiceFormSchema form_schema = 5;
}

message GetMyTaskHistoryRequest {
  string uuid = 1;
}

message MyTaskHistoryEvent {
  // Event type, currently "registered" for registration.
  string kind = 1;
  google.protobuf.Timestamp created_at = 2;
}

message GetMyTaskHistoryResponse {
  // Events visible to the applicant, oldest first.
  repeated MyTaskHistoryEvent events = 1;
}

message QueueTasksCursor {
  google.protobuf.Timestamp created_at = 1;
  string uuid = 2;
}

message ListQueueTasksRequest {
  string queue_code = 1;
  // Defaults to 50 and accepts up to 100 tasks per page.
  int32 page_size = 2;
  // Use next_cursor from the preceding page for the same queue and filters.
  QueueTasksCursor after = 3;
  optional int64 service_id = 4;
  optional int64 status_id = 5;
  optional int64 priority_id = 6;
  // Inclusive start and exclusive end of the creation period.
  google.protobuf.Timestamp created_from = 7;
  google.protobuf.Timestamp created_before = 8;
}

message QueueTaskListItem {
  string uuid = 1;
  string number = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  int64 service_id = 5;
  string service_name = 6;
  int64 status_id = 7;
  string status_name = 8;
  int64 priority_id = 9;
  string priority_name = 10;
}

message ListQueueTasksResponse {
  // Ordered by creation time and UUID, newest first.
  repeated QueueTaskListItem tasks = 1;
  QueueTasksCursor next_cursor = 2;
}
