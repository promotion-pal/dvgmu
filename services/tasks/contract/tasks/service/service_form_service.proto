syntax = "proto3";

package tasks.service;

import "tasks/entity/service_form.proto";

service ServiceFormService {
  rpc GetServiceForm(GetServiceFormRequest) returns (GetServiceFormResponse);
  rpc UpdateServiceForm(UpdateServiceFormRequest) returns (UpdateServiceFormResponse);
}

message GetServiceFormRequest {
  int64 service_id = 1;
}

message GetServiceFormResponse {
  int64 service_id = 1;
  int64 version = 2;
  tasks.entity.ServiceFormSchema schema = 3;
}

message UpdateServiceFormRequest {
  int64 service_id = 1;
  // Use 0 for the first update. Pass the current version for later updates.
  int64 expected_version = 2;
  // Full replacement of the current form. An empty schema clears the form.
  tasks.entity.ServiceFormSchema schema = 3;
}

message UpdateServiceFormResponse {
  int64 service_id = 1;
  int64 version = 2;
  tasks.entity.ServiceFormSchema schema = 3;
}
