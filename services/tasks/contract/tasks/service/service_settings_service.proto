syntax = "proto3";

package tasks.service;

service ServiceSettingsService {
  rpc GetServiceSettings(GetServiceSettingsRequest) returns (GetServiceSettingsResponse);
  rpc UpdateServiceSettings(UpdateServiceSettingsRequest) returns (UpdateServiceSettingsResponse);
}

message ServiceSettings {
  int64 initial_status_id = 1;
  int64 default_priority_id = 2;
}

message GetServiceSettingsRequest {
  int64 service_id = 1;
}

message GetServiceSettingsResponse {
  int64 service_id = 1;
  // Absent until the service has been configured.
  ServiceSettings settings = 2;
}

message UpdateServiceSettingsRequest {
  int64 service_id = 1;
  // Replaces both settings in one operation.
  ServiceSettings settings = 2;
}

message UpdateServiceSettingsResponse {
  int64 service_id = 1;
  ServiceSettings settings = 2;
}
