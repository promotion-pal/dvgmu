syntax = "proto3";

package tasks.service;

import "tasks/entity/service.proto";
import "tasks/entity/service_form.proto";
import "tasks/service/service_routes_service.proto";
import "tasks/service/service_settings_service.proto";

service CatalogService {
  rpc CreateService(CreateServiceRequest) returns (CreateServiceResponse);
  rpc GetService(GetServiceRequest) returns (GetServiceResponse);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc UpdateService(UpdateServiceRequest) returns (UpdateServiceResponse);
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);
  rpc GetServiceConfiguration(GetServiceConfigurationRequest) returns (GetServiceConfigurationResponse);
  rpc SaveServiceConfiguration(SaveServiceConfigurationRequest) returns (SaveServiceConfigurationResponse);
}

message CreateServiceRequest {
  int64 direction_id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  int32 sort_order = 5;
}

message CreateServiceResponse {
  tasks.entity.Service service = 1;
}

message GetServiceRequest {
  int64 id = 1;
}

message GetServiceResponse {
  tasks.entity.Service service = 1;
}

message ListServicesRequest {
  int32 page_size = 1;
  int64 after_id = 2;
  optional int64 direction_id = 3;
}

message ListServicesResponse {
  repeated tasks.entity.Service services = 1;
  int64 next_after_id = 2;
}

message UpdateServiceRequest {
  int64 id = 1;
  optional int64 direction_id = 2;
  optional string code = 3;
  optional string name = 4;
  optional string description = 5;
  optional int32 sort_order = 6;
  optional bool active = 7;
}

message UpdateServiceResponse {
  tasks.entity.Service service = 1;
}

message DeleteServiceRequest {
  int64 id = 1;
}

message DeleteServiceResponse {
  tasks.entity.Service service = 1;
}

message GetServiceConfigurationRequest {
  int64 service_id = 1;
}

message GetServiceConfigurationResponse {
  tasks.entity.Service service = 1;
  tasks.entity.ServiceFormSchema form = 2;
  ServiceSettings settings = 3;
  repeated ServiceRouteRule routes = 4;
  string version = 5;
}

message SaveServiceConfigurationRequest {
  // Use id 0 and an empty expected_version to create a service.
  tasks.entity.Service service = 1;
  tasks.entity.ServiceFormSchema form = 2;
  // Omit to keep the current defaults, or to create a service without defaults.
  ServiceSettings settings = 3;
  repeated ServiceRouteRule routes = 4;
  string expected_version = 5;
}

message SaveServiceConfigurationResponse {
  int64 service_id = 1;
}
