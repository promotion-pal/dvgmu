services:
  dvgmu_tasks_db:
    container_name: dvgmu_tasks_db
    image: postgres:17
    environment:
      POSTGRES_USER: ${TASKS_POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${TASKS_POSTGRES_PASSWORD:?set TASKS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TASKS_POSTGRES_DB:-dvgmu_tasks_db}
    volumes:
      - dvgmu_tasks_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dvgmu_tasks_api:
    container_name: "dvgmu_tasks_api"
    build:
      context: "../.."
      dockerfile: "services/tasks/Dockerfile"
    restart: unless-stopped
    depends_on:
      dvgmu_tasks_db:
        condition: service_healthy
    environment:
      DB_HOST: ${TASKS_POSTGRES_HOST:-dvgmu_tasks_db}
      DB_PORT: "5432"
      DB_USER: ${TASKS_POSTGRES_USER:-tasks}
      DB_PASSWORD: ${TASKS_POSTGRES_PASSWORD:?set TASKS_POSTGRES_PASSWORD}
      DB_NAME: ${TASKS_POSTGRES_DB:-dvgmu_tasks_db}
      DB_SSLMODE: disable
      GRPC_PORT: "4000"
    networks:
      - default
      - traefik-network

networks:
  traefik-network:
    external: true

volumes:
  dvgmu_tasks_pgdata:
