# STAND пустой (прод) → проект "sync", контейнер dvgmu_apps_sync_api, mdm прода.
# STAND=3_0 (стенд)   → проект dvgmu_apps_3_0_sync и mdm стенда. См. docs/stand.md.
name: ${STAND:+dvgmu_apps_${STAND}_}sync

services:
  # Ключ сервиса ≠ имени контейнера: имя сервиса — DNS-алиас в traefik-network.
  sync_api:
    container_name: "dvgmu_apps${STAND:+_${STAND}}_sync_api"
    build:
      context: "./api"
      dockerfile: "Dockerfile"
    restart: unless-stopped
    environment:
      SYNC_INTERVAL: ${SYNC_INTERVAL:-1h}
      MDM_SERVICE_URL: ${MDM_SERVICE_URL:-http://dvgmu_apps${STAND:+_${STAND}}_mdm_api:4000}
      MDM_INTERNAL_TOKEN: ${MDM_INTERNAL_TOKEN}
      AUTH_LDAP_URL: ${AUTH_LDAP_URL}
      AUTH_LDAP_START_TLS: ${AUTH_LDAP_START_TLS:-false}
      AUTH_LDAP_INSECURE_SKIP_VERIFY: ${AUTH_LDAP_INSECURE_SKIP_VERIFY:-false}
      AUTH_LDAP_BIND_DN: ${AUTH_LDAP_BIND_DN}
      AUTH_LDAP_BIND_PASSWORD: ${AUTH_LDAP_BIND_PASSWORD}
      AUTH_LDAP_BASE_DN: ${AUTH_LDAP_BASE_DN}
      SYNC_LDAP_WRITE_URL: ${SYNC_LDAP_WRITE_URL}
      SYNC_LDAP_WRITE_INSECURE_SKIP_VERIFY: ${SYNC_LDAP_WRITE_INSECURE_SKIP_VERIFY:-false}
      SYNC_LDAP_WRITE_BIND_DN: ${SYNC_LDAP_WRITE_BIND_DN}
      SYNC_LDAP_WRITE_BIND_PASSWORD: ${SYNC_LDAP_WRITE_BIND_PASSWORD}
      SYNC_LDAP_TARGET_OU: ${SYNC_LDAP_TARGET_OU}
      SYNC_LDAP_UPN_SUFFIX: ${SYNC_LDAP_UPN_SUFFIX:-dvgmu.local}
      TZ: ${TZ:-Asia/Vladivostok}
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true
