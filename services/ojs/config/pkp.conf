# Replaces the image's /etc/apache2/conf-enabled/pkp.conf
# Adds two things on top of the stock config:
#   1. X-Forwarded-Proto -> HTTPS=on on the :80 vhost (Traefik terminates TLS
#      and forwards plain HTTP; without this OJS force_ssl loops forever).
#   2. Short-URL redirects so /login and /admin work like /index/login and
#      /index/admin (bare paths are otherwise a 404 in OJS routing).

<VirtualHost *:80>
	ServerName www.example.com
	DocumentRoot /var/www/html

	RewriteEngine On
	AcceptPathInfo On

	# (1) Honour the reverse proxy's scheme
	SetEnvIf X-Forwarded-Proto   "^https$" HTTPS=on
	SetEnvIf X-Forwarded-Protocol "^https$" HTTPS=on
	SetEnvIf X-Forwarded-Ssl     "^on$"    HTTPS=on

	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride all
		Allow from all

		# (2) Convenience redirects to the real OJS routes
		RewriteRule ^login/?$  /index/login  [R=302,L]
		RewriteRule ^admin/?$  /index/admin  [R=302,L]

		# This removes index.php from the url
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^(.*)$ index.php/$1 [QSA,L]
	</Directory>

	<Directory /var/www/html/public>
		php_flag engine off
	</Directory>

	# See https://github.com/pkp/docker-ojs/issues/29
	ErrorLog  /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>

<VirtualHost *:443>
	ServerName www.example.com
	DocumentRoot /var/www/html

	RewriteEngine On
	AcceptPathInfo On

	SSLEngine On
	SSLCertificateFile /etc/ssl/apache2/server.pem
	SSLCertificateKeyFile /etc/ssl/apache2/server.key
	# SSLCertificateChainFile /etc/ssl/certs/chain.pem

	# Avoid issues with PKP tools when you are behind a reverse proxy:
	SetEnv HTTPS On
	PassEnv HTTPS
	SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride all
		Allow from all

		RewriteRule ^login/?$  /index/login  [R=302,L]
		RewriteRule ^admin/?$  /index/admin  [R=302,L]

		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^(.*)$ index.php/$1 [QSA,L]
	</Directory>

	<Directory /var/www/html/public>
		php_flag engine off
	</Directory>

	# See https://github.com/pkp/docker-ojs/issues/29
	ErrorLog  /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
