; Mounted to /usr/local/etc/php/conf.d/zz-ojs.ini
; The base image ships tiny limits (upload 2M / post 8M / memory 128M) — too small
; for real article PDFs and imports. These are sane values for a journal.

upload_max_filesize = 64M
post_max_size = 80M
memory_limit = 512M
max_execution_time = 120
max_input_vars = 5000

; Uploaded XML/CSV imports and galley files
max_file_uploads = 40

date.timezone = "Asia/Vladivostok"

; Do not leak PHP errors to visitors in production
display_errors = Off
log_errors = On
