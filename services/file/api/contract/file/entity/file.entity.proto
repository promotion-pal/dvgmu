syntax = "proto3";

package contract.file.entity;

import "google/protobuf/timestamp.proto";
import "file/enum/file.enum.proto";

option go_package = "entity;entity_pb";

message File {
  int64 id = 1;
  int64 user_id = 2;
  int64 file_size = 3;
  string file_name = 4;
  contract.file.enum.FileType type = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Detected from the content when the file is stored.
  string mime_type = 8;
}
