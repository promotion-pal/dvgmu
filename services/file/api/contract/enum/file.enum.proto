syntax = "proto3";

package contract.file.enum;

option go_package = "enum;enum_pb";

// FileUploadRequest.type — what happens to an uploaded file: the parsers read
// it and keep nothing; the storage types save it to disk, each in its own
// folder under storage.base_path, and answer with the stored file.
enum FileType {
    FILE_TYPE_UNSPECIFIED = 0;
    FILE_TYPE_EXCEL_PARSER_USER = 1;
    FILE_TYPE_EXCEL_PARSER_STUDENT = 2;
    // Library editions (PDF, EPUB, DOCX) — library/books.
    FILE_TYPE_LIBRARY_BOOK = 3;
    // Images and attachments of study manuals — library/manuals.
    FILE_TYPE_LIBRARY_MANUAL = 4;
    // Pictures of test questions (JPEG, PNG) — tests/images.
    FILE_TYPE_TEST_IMAGE = 5;
}

// FileGenerateRequest.type — which document is generated.
enum FileGenerateType {
    FILE_GENERATE_TYPE_UNSPECIFIED = 0;
    // application_dormitory_student.docx
    FILE_GENERATE_TYPE_WORD_GEN_APPLICATION_DORMITORY = 1;
    // application_dormitory_student_full.docx
    FILE_GENERATE_TYPE_WORD_GEN_APPLICATION_DORMITORY_STUDENT_FULL = 2;
    // application_dormitory_abitur.docx
    FILE_GENERATE_TYPE_WORD_GEN_APPLICATION_DORMITORY_ABITUR = 3;
    // application_temporary_residence.docx
    FILE_GENERATE_TYPE_WORD_GEN_APPLICATION_TEMPORARY_RESIDENCE = 4;
    // military_registration_card.docx
    FILE_GENERATE_TYPE_WORD_GEN_MILITARY_REGISTRATION_CARD = 5;
    // study_certificate.docx — needs no params: profile only.
    FILE_GENERATE_TYPE_WORD_GEN_STUDY_CERTIFICATE = 6;
    // application_certificate_enrollment.docx — needs no params: profile only.
    FILE_GENERATE_TYPE_WORD_GEN_APPLICATION_CERTIFICATE_ENROLLMENT = 7;
}
