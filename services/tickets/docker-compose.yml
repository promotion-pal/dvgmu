services:
  dvgmu_apps_ticket_db:
    container_name: dvgmu_apps_ticket_db
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-dvgmu_tickets_db}
    volumes:
      - ./db/postgres:/var/lib/postgresql/data
    networks:
      - traefik-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dvgmu_apps_ticket_api:
    container_name: "dvgmu_apps_ticket_api"
    build:
      context: "../.."
      dockerfile: "services/tickets/Dockerfile"
      network: host
    restart: unless-stopped
    depends_on:
      dvgmu_apps_ticket_db:
        condition: service_healthy
    environment:
      DB_HOST: ${POSTGRES_HOST:-dvgmu_apps_ticket_db}
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-root}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_NAME: ${POSTGRES_DB:-dvgmu_tickets_db}
      DB_SSLMODE: disable
      GRPC_PORT: "4000"
      MDM_URL: ${MDM_URL:-http://dvgmu_mdm_api:4000}
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true

volumes:
  dvgmu_apps_ticket_pgdata:
