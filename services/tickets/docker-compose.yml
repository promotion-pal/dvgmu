services:
  dvgmu_apps_ticket_db:
    container_name: dvgmu_apps_ticket_db
    image: postgres:17
    environment:
      POSTGRES_USER: ${TICKETS_DB_USER:-root}
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD:-password}
      POSTGRES_DB: ${TICKETS_DB_NAME:-dvgmu_tickets_db}
    volumes:
      - ./db/postgres:/var/lib/postgresql/data
    networks:
      - dvgmu-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dvgmu_apps_ticket_api:
    container_name: "dvgmu_apps_ticket_api"
    build:
      context: "../.."
      dockerfile: "services/tickets/Dockerfile"
      network: host
    restart: unless-stopped
    depends_on:
      dvgmu_apps_ticket_db:
        condition: service_healthy
    environment:
      DB_HOST: ${TICKETS_DB_HOST:-dvgmu_apps_ticket_db}
      DB_PORT: "5432"
      DB_USER: ${TICKETS_DB_USER:-root}
      DB_PASSWORD: ${TICKETS_DB_PASSWORD:-password}
      DB_NAME: ${TICKETS_DB_NAME:-dvgmu_tickets_db}
      DB_SSLMODE: disable
      GRPC_PORT: "4000"
      MDM_URL: ${TICKETS_MDM_URL:-http://dvgmu_mdm_api:4000}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?Set GATEWAY_SHARED_SECRET in .env}
    networks:
      - dvgmu-backend

networks:
  dvgmu-backend:
    external: true
    name: dvgmu-backend

volumes:
  dvgmu_apps_ticket_pgdata:
