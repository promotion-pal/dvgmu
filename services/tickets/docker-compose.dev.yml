services:
  dvgmu_apps_ticket_db:
    image: postgres:17
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dvgmu_tickets_db
    ports:
      - "5446:5432"
    volumes:
      - tickets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d dvgmu_tickets_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  dvgmu_apps_ticket_api:
    build:
      context: ../..
      dockerfile: services/tickets/Dockerfile
    command: ["./tickets", "--config=config/local.yaml"]
    depends_on:
      dvgmu_apps_ticket_db:
        condition: service_healthy
    ports:
      - "4050:4050"
    environment:
      DB_HOST: dvgmu_apps_ticket_db
      DB_PORT: "5432"
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: dvgmu_tickets_db
      DB_SSLMODE: disable
      GRPC_PORT: "4050"
    restart: unless-stopped

volumes:
  tickets_pgdata:
