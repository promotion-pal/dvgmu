services:
  dvgmu_apps_ticket_db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${TICKETS_DB_USER:-root}
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD:-password}
      POSTGRES_DB: ${TICKETS_DB_NAME:-dvgmu_tickets_db}
    ports:
      - "${TICKETS_DB_PORT:-5446}:5432"
    volumes:
      - tickets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dvgmu_apps_ticket_api:
    build:
      context: ../..
      dockerfile: services/tickets/Dockerfile
    command: ["./tickets", "--config=config/local.yaml"]
    depends_on:
      dvgmu_apps_ticket_db:
        condition: service_healthy
    ports:
      - "${TICKETS_GRPC_PORT:-4050}:4050"
    environment:
      DB_HOST: dvgmu_apps_ticket_db
      DB_PORT: "5432"
      DB_USER: ${TICKETS_DB_USER:-root}
      DB_PASSWORD: ${TICKETS_DB_PASSWORD:-password}
      DB_NAME: ${TICKETS_DB_NAME:-dvgmu_tickets_db}
      DB_SSLMODE: disable
      GRPC_PORT: "4050"
      MDM_URL: ${TICKETS_DEV_MDM_URL:-http://host.docker.internal:4051}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?Set GATEWAY_SHARED_SECRET in .env}
    restart: unless-stopped

volumes:
  tickets_pgdata:
