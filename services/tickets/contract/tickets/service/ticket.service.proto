syntax = "proto3";

package contract.tickets.service;

option go_package = "service;service_pb";

import "tickets/entity/ticket.entity.proto";

service TaskService {
  rpc CreateTask (CreateTaskRequest) returns (CreateTaskResponse);
  rpc ListTasks (ListTasksRequest) returns (ListTasksResponse);
}

message CreateTaskRequest {
  string title = 1;
  reserved 2;
  reserved "user_id";
}

message CreateTaskResponse {
  contract.tickets.entity.Task task = 1;
}

message ListTasksRequest {
  reserved 1;
  reserved "user_id";
}

message ListTasksResponse {
  repeated contract.tickets.entity.Task tasks = 1;
}
