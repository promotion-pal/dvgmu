services:
  dvgmu_apps_mdm_pg:
    container_name: "dvgmu_apps_mdm_pg"
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5470:5432"
    volumes:
      - ./db:/var/lib/postgresql/data
    restart: unless-stopped