syntax = "proto3";

package contract.entity;

option go_package = "entity;entity_pb";

import "google/protobuf/timestamp.proto";
import "enum/doc.enum.proto";

message Education {
    int64 id = 1;
    contract.enum.EducationType type = 2;
    contract.enum.EducationStatus status = 3;

    string series = 4;
    string number = 5;
    string registration_number = 6;
    google.protobuf.Timestamp issue_date = 7;
    
    string institution_inn = 8;
    string institution_name = 9;
    string institution_city = 10;
    string institution_region = 11;
    string institution_country_code = 12;
    
    string specialty_code = 13;
    string specialty_name = 14;
    string qualification = 15;
    string honors = 16;
    
    string supplement_series = 17;
    string supplement_number = 18;
    
    bool is_original = 19;
    bool is_verified_via_frdo = 20;
    
    google.protobuf.Timestamp created_at = 21;
    google.protobuf.Timestamp updated_at = 22;
}

/*
 * Разбор универсальных полей:
 * registration_number: Регистрационный номер (он пишется на бланках отдельно от серии и номера и критически важен для дипломов).
 * institution_name: Официальное наименование учреждения (МБОУ СОШ №..., ДВГМУ, ХКТ и т.д.).
 * specialty_code и specialty_name: Код и наименование специальности (например, для диплома — 31.05.01, Лечебное дело. Для школьного аттестата эти поля просто останутся пустыми строками).
 * honors: Признак отличия (сюда можно записать "GOLD_MEDAL" для школы, "WITH_HONORS" для красного диплома или оставить пустым).
 * supplement_series и supplement_number: Реквизиты приложения с оценками (вкладыша). Они часто имеют собственные уникальные номера, отличные от корочки.
 * is_verified_via_frdo: Флаг проверки через ФРДО (Федеральный реестр документов об образовании) — супер-полезное поле для вашей системы аналитики, чтобы главврач сразу видел, подтвержден ли диплом нового сотрудника официально.
 */