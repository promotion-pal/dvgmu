syntax = "proto3";

package contract.entity;

option go_package = "entity;entity_pb";

import "enum/user.enum.proto";
import "google/protobuf/timestamp.proto";

message Passport {
    int64 id = 1;
    string series = 2;
    string number = 3;
    
    string authority = 4;
    string issue_date = 5;
    string expiry_date = 6;
    string department_code = 7;
    
    string snils = 8;
    string birth_place = 9;
    contract.enum.UserGender gender = 10;
    contract.enum.UserNationality nationality = 11;
    
    string registration_date = 12;
    string residential_address = 13;
    string registration_address = 14;
    
    google.protobuf.Timestamp created_at = 15;
    google.protobuf.Timestamp updated_at = 16;
}