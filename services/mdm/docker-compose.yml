# Один файл и для прода, и для тестового стенда рядом с ним.
# STAND пустой (прод) → проект "mdm", контейнеры dvgmu_apps_mdm_*.
# STAND=3_0 (стенд)   → проект dvgmu_apps_3_0_mdm, контейнеры dvgmu_apps_3_0_mdm_*.
# Данные БД — ./db рядом с этим файлом, у стенда это своя папка.
name: ${STAND:+dvgmu_apps_${STAND}_}mdm

services:
  # Ключи сервисов (mdm_api/mdm_db) намеренно НЕ совпадают с именами
  # контейнеров: имя сервиса — DNS-алиас в traefik-network, и у стенда оно
  # не должно перехватывать прод-имя dvgmu_apps_mdm_api.
  mdm_api:
    container_name: "dvgmu_apps${STAND:+_${STAND}}_mdm_api"
    build:
      context: "../.."  # корень монорепо: нужен packages/go
      dockerfile: "services/mdm/api/Dockerfile"
    env_file:
      - .env
    environment:
      # Не из .env: mdm_db виден только во внутренней сети своего проекта.
      POSTGRES_HOST: mdm_db
      POSTGRES_PORT: "5432"
    restart: unless-stopped
    networks:
      - default
      - traefik-network
    depends_on:
      mdm_db:
        condition: service_healthy

  mdm_db:
    container_name: "dvgmu_apps${STAND:+_${STAND}}_mdm_db"
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  traefik-network:
    external: true
