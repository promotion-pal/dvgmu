services:
  dvgmu_mdm_db:
    container_name: dvgmu_mdm_db
    image: postgres:17
    environment:
      POSTGRES_USER: ${MDM_DB_USER:-root}
      POSTGRES_PASSWORD: ${MDM_DB_PASSWORD:-password}
      POSTGRES_DB: ${MDM_DB_NAME:-dvgmu_mdm_db}
    volumes:
      - ./db/postgres:/var/lib/postgresql/data
    networks:
      - dvgmu-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dvgmu_mdm_api:
    container_name: dvgmu_mdm_api
    build:
      context: ../..
      dockerfile: services/mdm/Dockerfile
      network: host
    depends_on:
      dvgmu_mdm_db:
        condition: service_healthy
    environment:
      DB_HOST: ${MDM_DB_HOST:-dvgmu_mdm_db}
      DB_PORT: "5432"
      DB_USER: ${MDM_DB_USER:-root}
      DB_PASSWORD: ${MDM_DB_PASSWORD:-password}
      DB_NAME: ${MDM_DB_NAME:-dvgmu_mdm_db}
      DB_SSLMODE: disable
      GRPC_PORT: "4000"
      GRPC_ALLOWED_ORIGINS: ${MDM_ALLOWED_ORIGINS:-https://api.core.fesmu.ru}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?Set GATEWAY_SHARED_SECRET in .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    networks:
      - dvgmu-backend
    restart: unless-stopped

networks:
  dvgmu-backend:
    external: true
    name: dvgmu-backend
