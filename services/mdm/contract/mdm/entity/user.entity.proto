syntax = "proto3";

package contract.entity;

option go_package = "entity;entity_pb";

import "mdm/enum/user.enum.proto";
import "google/protobuf/timestamp.proto";

message User {
    int64 id = 1;
    string uuid = 2;
    optional string ad_object_id = 3;

    UserPermission permission = 4;
    repeated contract.enum.UserRole roles = 5;

    string last_name = 6;
    string first_name = 7;
    optional string patronymic = 8;

    string email = 9;
    optional string phone = 10;
    contract.enum.UserStatus status = 11;
    optional google.protobuf.Timestamp birthday = 12;

    google.protobuf.Timestamp created_at = 13;
    google.protobuf.Timestamp updated_at = 14;
}

message UserFull { User user = 1; }

message UserPermission {
    string user_uuid = 1;
    repeated contract.enum.UserPermission permissions = 2;
}