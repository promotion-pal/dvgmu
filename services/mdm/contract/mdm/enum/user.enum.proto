syntax = "proto3";

package contract.enum;

option go_package = "enum;enum_pb";

// User

enum UserStatus {
    USER_STATUS_UNSPECIFIED = 0;
    USER_STATUS_ACTIVE = 1;
    USER_STATUS_INACTIVE = 2;
}

enum UserRole {
    USER_ROLE_UNSPECIFIED = 0;
    USER_ROLE_STUDENT = 1;
    USER_ROLE_EMPLOYEE = 2;
    USER_ROLE_ADMIN = 3;
}

enum UserGender {
    USER_GENDER_UNSPECIFIED = 0;
    USER_GENDER_MALE = 1;
    USER_GENDER_FEMALE = 2;
}

enum UserNationality {
    USER_NATIONALITY_UNSPECIFIED = 0;
    USER_NATIONALITY_RUS = 1;
    USER_NATIONALITY_BLR = 2;
    USER_NATIONALITY_KAZ = 3;
    USER_NATIONALITY_UZB = 4;
    USER_NATIONALITY_KGZ = 5;
    USER_NATIONALITY_CHN = 6;
}

// Student

enum UserStudentStatus {
    USER_STUDENT_STATUS_UNSPECIFIED = 0;
    USER_STUDENT_STATUS_STUDYING = 1;         // Учится
    USER_STUDENT_STATUS_EXPELLED = 2;         // Отчислен
    USER_STUDENT_STATUS_ACADEMIC_LEAVE = 3;    // В академическом отпуске
    USER_STUDENT_STATUS_RESTORED = 4;          // Восстановлен
    USER_STUDENT_STATUS_GRADUATED = 5;         // Выпустился (завершил обучение)
    USER_STUDENT_STATUS_TRANSFERRED = 6;       // Переведен
}

enum UserStudentEducationForm {
    USER_STUDENT_EDUCATION_FORM_UNSPECIFIED = 0;
    USER_STUDENT_EDUCATION_FORM_BUDGET = 1;
    USER_STUDENT_EDUCATION_FORM_TARGET = 2;
    USER_STUDENT_EDUCATION_FORM_CONTRACT = 3;
    USER_STUDENT_EDUCATION_FORM_SPECIAL_QUOTA = 4;
}

// Employee

enum UserEmployeeStatus {
USER_PRESENCE_STATUS_UNSPECIFIED = 0;
    USER_PRESENCE_STATUS_AVAILABLE = 1;       // На связи / Работает
    USER_PRESENCE_STATUS_VACATION = 2;        // В отпуске (Vacation)
    USER_PRESENCE_STATUS_SICK_LEAVE = 3;      // На больничном (Sick Leave)
    USER_PRESENCE_STATUS_PARENTAL_LEAVE = 4;  // В декрете (Maternity/Paternity)
    USER_PRESENCE_STATUS_OUT_OF_OFFICE = 5;   // Отгул / Нет на месте сегодня (OOO)
    USER_PRESENCE_STATUS_BUSINESS_TRIP = 6;   // В командировке (Business Trip)
}

enum UserEmployeeDepartment {
    USER_EMPLOYEE_DEPARTMENT_UNSPECIFIED = 0;
    // ИТ-отдел
    USER_EMPLOYEE_DEPARTMENT_IT = 1;
}

enum UserPermission {
    USER_PERMISSION_UNSPECIFIED = 0;
    // Task
    USER_TASK_READ = 1;
    USER_TASK_CREATE = 2;
    USER_TASK_UPDATE = 3;
    USER_TASK_DELETE = 4;
}