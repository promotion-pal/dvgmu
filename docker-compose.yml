    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.guide-secure.rule=Host(`guide.dvgmu.promotion-pal.ru`)"
