name: dvgmu_apps

services:
  dvgmu_apps_ksm_web:
    container_name: "dvgmu_apps_ksm_web"
    image: "dvgmu_apps_ksm_web:latest"
    build:
      context: "./apps/ksm"
      dockerfile: "Dockerfile"
      network: host
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.ksm-secure.rule=Host(`ksm.dvgmu.promotion-pal.ru`)"
      - "traefik.http.routers.ksm-secure.entrypoints=websecure"
      - "traefik.http.routers.ksm-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.ksm-web.loadbalancer.server.port=3000"

  dvgmu_apps_unistom_web:
    container_name: "dvgmu_apps_unistom_web"
    image: "dvgmu_apps_unistom_web:latest"
