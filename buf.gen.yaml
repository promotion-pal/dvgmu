version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: fesmu/contract

plugins:
  - local: protoc-gen-go
    out: packages/go
    opt:
      - paths=import
      - module=fesmu/contract
  - local: protoc-gen-connect-go
    out: packages/go
    opt:
      - paths=import
      - module=fesmu/contract
  - local: protoc-gen-es
    out: packages/ts
    opt:
      - target=ts
      - import_extension=none
