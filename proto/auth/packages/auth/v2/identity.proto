syntax = "proto3";

package contract.auth.v2;

import "google/protobuf/timestamp.proto";

service IdentityService {
    rpc BatchLinkMDM2AD (BatchLinkMDM2ADRequest) returns (BatchLinkMDM2ADResponse);
    rpc FetchIdentityByID (FetchIdentityByIDRequest) returns (FetchIdentityByIDResponse);
    rpc FetchIdentity (FetchIdentityRequest) returns (FetchIdentityResponse);
}

message Identity {
    int64 id = 1;
    int64 mdm_id = 2;
    string object_guid = 3;
    google.protobuf.Timestamp synced_at = 4;
    string email = 5;
    string login = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
}

message MDM2ADLink {
    int64 mdm_id = 1;
    string object_guid = 2;
}

message BatchLinkMDM2ADRequest {
    repeated MDM2ADLink links = 1;
}

message BatchLinkMDM2ADResponse {
    bool success = 1;
}

message FetchIdentityByIDRequest {
    int64 id = 1;
}

message FetchIdentityByIDResponse {
    Identity identity = 1;
}

message FetchIdentityRequest {
    int32 page = 1;
    int32 page_size = 2;

    int64 mdm_id = 3;
    string object_guid = 4;
    string email = 5;
    string login = 6;
    optional bool linked = 7;
}

message FetchIdentityResponse {
    repeated Identity identities = 1;
    int64 total = 2;
}
