syntax = "proto3";

package contract.auth.v2;

import "google/protobuf/timestamp.proto";

// User — только контракт для клиентов, в БД auth не хранится.
message User {
    int64 id = 1;
    int64 mdm_id = 2;
    string object_guid = 3;

    string email = 4;
    string last_name = 5;
    string first_name = 6;

    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
}
