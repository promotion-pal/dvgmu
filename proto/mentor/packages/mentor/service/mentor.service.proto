syntax = "proto3";

package contract.service;

import "packages/mentor/entity/mentor.entity.proto";
import "google/protobuf/timestamp.proto";

option go_package = "service;service_pb";

service MentorService {
    rpc MentorApplicationCreate (MentorApplicationCreateRequest) returns (MentorApplicationCreateResponse);
    rpc MentorApplicationByID (MentorApplicationByIDRequest) returns (MentorApplicationByIDResponse);
    rpc MentorApplicationFetch (MentorApplicationFetchRequest) returns (stream MentorApplicationByIDResponse);
    rpc MentorApplicationUpdate (MentorApplicationUpdateRequest) returns (MentorApplicationUpdateResponse);
    rpc MentorApplicationDelete (MentorApplicationDeleteRequest) returns (MentorApplicationDeleteResponse);
    rpc MentorApplicationMarkDone (MentorApplicationMarkDoneRequest) returns (MentorApplicationMarkDoneResponse);

    rpc MentorCourseCreate (MentorCourseCreateRequest) returns (MentorCourseCreateResponse);
    rpc MentorCourseByID (MentorCourseByIDRequest) returns (MentorCourseByIDResponse);
    rpc MentorCourseFetch (MentorCourseFetchRequest) returns (stream MentorCourseFetchResponse);
    rpc MentorCourseUpdate (MentorCourseUpdateRequest) returns (MentorCourseUpdateResponse);
    rpc MentorCourseDelete (MentorCourseDeleteRequest) returns (MentorCourseDeleteResponse);

    rpc MentorQuestionCreate (MentorQuestionCreateRequest) returns (MentorQuestionCreateResponse);
    rpc MentorQuestionFetch (MentorQuestionFetchRequest) returns (stream MentorQuestionFetchResponse);
    rpc MentorQuestionDelete (MentorQuestionDeleteRequest) returns (MentorQuestionDeleteResponse);
    rpc MentorQuestionMarkDone (MentorQuestionMarkDoneRequest) returns (MentorQuestionMarkDoneResponse);

    rpc MentorTechnicalQuestionCreate (MentorTechnicalQuestionCreateRequest) returns (MentorTechnicalQuestionCreateResponse);
    rpc MentorTechnicalQuestionFetch (MentorTechnicalQuestionFetchRequest) returns (stream MentorTechnicalQuestionFetchResponse);
    rpc MentorTechnicalQuestionDelete (MentorTechnicalQuestionDeleteRequest) returns (MentorTechnicalQuestionDeleteResponse);
    rpc MentorTechnicalQuestionMarkDone (MentorTechnicalQuestionMarkDoneRequest) returns (MentorTechnicalQuestionMarkDoneResponse);
}

// MentorApplication CRUD

message MentorApplicationCreateRequest {
    string firstName = 1;
    string lastName = 2;
    string patronymic = 3;
    string email = 4;
    int64 course_id = 5;
}

message MentorApplicationCreateResponse {
    bool success = 1;
    string message = 2;
    int64 id = 3;
}

message MentorApplicationByIDRequest {
    int64 id = 1;
}

message MentorApplicationByIDResponse {
    contract.entity.MentorApplication application = 1;
}

message MentorApplicationFetchRequest {
    int64 course_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

message MentorApplicationUpdateRequest {
    int64 id = 1;
    string firstName = 2;
    string lastName = 3;
    string patronymic = 4;
    string email = 5;
    int64 course_id = 6;
}

message MentorApplicationUpdateResponse {
    bool success = 1;
    string message = 2;
}

message MentorApplicationDeleteRequest {
    int64 id = 1;
}

message MentorApplicationDeleteResponse {
    bool success = 1;
    string message = 2;
}

message MentorApplicationMarkDoneRequest {
    int64 id = 1;
    bool is_done = 2;
}

message MentorApplicationMarkDoneResponse {
    bool success = 1;
    string message = 2;
}

// MentorCourse CRUD

message MentorCourseCreateRequest {
    google.protobuf.Timestamp start_date = 1;
    google.protobuf.Timestamp end_date = 2;
}

message MentorCourseCreateResponse {
    bool success = 1;
    string message = 2;
    int64 id = 3;
}

message MentorCourseByIDRequest {
    int64 id = 1;
}

message MentorCourseByIDResponse {
    contract.entity.MentorCourse course = 1;
}

message MentorCourseFetchRequest {
    int32 page = 1;
    int32 page_size = 2;
}

message MentorCourseFetchResponse {
    contract.entity.MentorCourse course = 1;
}

message MentorCourseUpdateRequest {
    int64 id = 1;
    google.protobuf.Timestamp start_date = 2;
    google.protobuf.Timestamp end_date = 3;
}

message MentorCourseUpdateResponse {
    bool success = 1;
    string message = 2;
}

message MentorCourseDeleteRequest {
    int64 id = 1;
}

message MentorCourseDeleteResponse {
    bool success = 1;
    string message = 2;
}

// MentorQuestion CRUD

message MentorQuestionCreateRequest {
    string firstName = 1;
    string lastName = 2;
    string patronymic = 3;
    string email = 4;
    string question = 5;
}

message MentorQuestionCreateResponse {
    bool success = 1;
    string message = 2;
    int64 id = 3;
}

message MentorQuestionFetchRequest {
    int32 page = 1;
    int32 page_size = 2;
}

message MentorQuestionFetchResponse {
    contract.entity.MentorQuestion question = 1;
}

message MentorQuestionDeleteRequest {
    int64 id = 1;
}

message MentorQuestionDeleteResponse {
    bool success = 1;
    string message = 2;
}

message MentorQuestionMarkDoneRequest {
    int64 id = 1;
    bool is_done = 2;
}

message MentorQuestionMarkDoneResponse {
    bool success = 1;
    string message = 2;
}

// MentorTechnicalQuestion CRUD

message MentorTechnicalQuestionCreateRequest {
    string firstName = 1;
    string lastName = 2;
    string patronymic = 3;
    string email = 4;
    int64 course_id = 5;
    string question = 6;
}

message MentorTechnicalQuestionCreateResponse {
    bool success = 1;
    string message = 2;
    int64 id = 3;
}

message MentorTechnicalQuestionFetchRequest {
    int64 course_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

message MentorTechnicalQuestionFetchResponse {
    contract.entity.MentorTechnicalQuestion question = 1;
}

message MentorTechnicalQuestionDeleteRequest {
    int64 id = 1;
}

message MentorTechnicalQuestionDeleteResponse {
    bool success = 1;
    string message = 2;
}

message MentorTechnicalQuestionMarkDoneRequest {
    int64 id = 1;
    bool is_done = 2;
}

message MentorTechnicalQuestionMarkDoneResponse {
    bool success = 1;
    string message = 2;
}
