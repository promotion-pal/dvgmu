syntax = "proto3";

package contract.entity;

option go_package = "entity;entity_pb";

import "packages/mdm/enum/user.enum.proto";
import "google/protobuf/timestamp.proto";

message Student {
    int64 id = 1;
    int64 user_id = 2;

    string group = 3;
    string record_book = 4;
    contract.enum.UserStudentStatus status = 5;
    contract.enum.UserStudentEducationForm education_form = 6;

    bool needs_dormitory = 7;

    google.protobuf.Timestamp created_at = 8;
    google.protobuf.Timestamp updated_at = 9;
}
