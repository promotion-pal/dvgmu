syntax = "proto3";

package contract.service;

import "packages/dormitory/entity/dormitory.entity.proto";
import "google/protobuf/timestamp.proto";

option go_package = "service;service_pb";

service DormitoryService {
    rpc DormitoryRegistrationByID (DormitoryRegistrationByIDRequest) returns (DormitoryRegistrationByIDResponse);
    rpc DormitoryRegistrationFetch (DormitoryRegistrationFetchRequest) returns (stream DormitoryRegistrationByIDResponse);
    rpc DormitoryRegistrationCreate (DormitoryRegistrationCreateRequest) returns (DormitoryRegistrationCreateResponse);

    // Только для админа (заголовок Authorization: Bearer <пароль>).
    // Переносит дату существующей записи (id > 0) либо создаёт запись
    // без студенческих ограничений — id == 0, тогда нужны user_id и room.
    rpc DormitoryRegistrationAdminUpsert (DormitoryRegistrationAdminUpsertRequest) returns (DormitoryRegistrationCreateResponse);
}

message DormitoryRegistrationByIDRequest {
    int64 id = 1;
}

message DormitoryRegistrationByIDResponse {
    contract.entity.DormitoryRegistration entity = 1;
}

message DormitoryRegistrationFetchRequest {
    optional int64 user_id = 1;
    optional int32 room = 2;
    optional string record_book = 3;
    optional google.protobuf.Timestamp start_date = 4;
    optional google.protobuf.Timestamp end_date = 5;
}

message DormitoryRegistrationCreateRequest {
    int64 user_id = 1;
    int32 room = 2;
    string record_book = 3;
    google.protobuf.Timestamp data = 4;
}

message DormitoryRegistrationCreateResponse {
    int64 id = 1;
    bool success = 2;
    string message = 3;
}

message DormitoryRegistrationAdminUpsertRequest {
    int64 id = 1;        // 0 -> создать новую, иначе перенести дату существующей
    int64 user_id = 2;   // нужен при id == 0
    int32 room = 3;      // нужен при id == 0
    google.protobuf.Timestamp data = 4;
}
