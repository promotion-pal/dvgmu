syntax = "proto3";

package contract.enum;

option go_package = "enum;enum_pb";

enum AssignmentType {
  ASSIGNMENT_TYPE_UNSPECIFIED = 0;       // Дефолтный неопределенный тип
  ASSIGNMENT_TYPE_GENERAL_CLEANING = 1;  // Генеральная уборка (кухня, блоки)
}


enum AssignmentStatus {
  ASSIGNMENT_STATUS_UNSPECIFIED = 0;
  ASSIGNMENT_STATUS_TODO = 1;
  ASSIGNMENT_STATUS_REVIEW = 2;
  ASSIGNMENT_STATUS_DONE = 3;
  ASSIGNMENT_STATUS_REJECTED = 4;
}
